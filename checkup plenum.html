<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noch fit? – Start: Quadratische Funktionen (Plenum)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  --navy:#16324F; --orange:#D97F2E; --lila:#6B3F8C; --gold:#E8A33D;
  --green:#2E9E5B; --red:#C0392B; --bg:#F6F8FB; --u:1;
  --head:'Fredoka','Trebuchet MS','Segoe UI',Arial,sans-serif;
  --text:'Nunito','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--navy);font-family:var(--text)}
body{position:fixed;inset:0}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;
  transform:scale(var(--u));transform-origin:center center;background:var(--bg);overflow:hidden}
.bar{position:absolute;left:0;top:0;height:12px;background:var(--gold);transition:width .3s}
header{position:absolute;left:70px;right:70px;top:30px;height:84px;display:flex;align-items:center;justify-content:space-between}
.chip{font-family:var(--head);font-weight:600;font-size:46px;background:var(--navy);color:#fff;border-radius:60px;padding:6px 38px;line-height:1.25}
.chip.lila{background:var(--lila)} .chip.gold{background:var(--gold);color:var(--navy)}
.prog{font-family:var(--head);font-weight:600;font-size:46px;color:var(--navy)}
main{position:absolute;left:70px;right:70px;top:126px;height:834px}
.card{width:100%;height:100%;background:#fff;border-radius:36px;box-shadow:0 8px 30px rgba(22,50,79,.12);
  padding:36px 64px;display:flex;align-items:center;gap:56px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:26px}
.gfx{flex:none;display:flex;align-items:center;justify-content:center}
.gfx svg{display:block}
footer{position:absolute;left:70px;right:70px;top:978px;height:84px;display:flex;align-items:center;justify-content:space-between;gap:30px}
button{font-family:var(--head);font-weight:600;font-size:40px;border:none;border-radius:24px;height:84px;padding:0 44px;cursor:pointer;
  background:#fff;color:var(--navy);box-shadow:0 4px 14px rgba(22,50,79,.18);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button.main{background:var(--navy);color:#fff;min-width:560px;font-size:46px}
button:active{transform:translateY(2px)}
.hint{font-size:28px;font-weight:700;color:#5b6f85;text-align:center;flex:1}

/* Schrittweise Anzeige */
[data-s]{opacity:0;transition:opacity .3s}
[data-s].on{opacity:1}

/* Mathe */
.m{white-space:nowrap}
sup{font-size:.6em;line-height:0;vertical-align:.55em}
.rd{display:inline-block;border-top:.07em solid currentColor;padding:0 .12em;margin-left:-.04em;line-height:.8}
.q{font-weight:800;font-size:76px;line-height:1.25}
.q.s{font-size:64px}
.ln{font-weight:800;font-size:72px;line-height:1.3}
.ln.fin,.fin{color:var(--green)}
.hl{color:var(--green)}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:36px;min-height:104px}
.row .eq{font-weight:800;font-size:84px;line-height:1.2;white-space:nowrap}
.row .op{font-weight:800;font-size:46px;background:rgba(232,163,61,.2);border:3px solid var(--gold);border-radius:18px;padding:2px 22px;white-space:nowrap}
.merke{font-weight:800;font-size:50px;line-height:1.3;background:rgba(232,163,61,.18);border-left:12px solid var(--gold);border-radius:12px;padding:16px 28px}
.achtung{font-weight:800;font-size:50px;line-height:1.3;background:rgba(192,57,43,.08);border-left:12px solid var(--red);border-radius:12px;padding:16px 28px}
.q small,.note{font-size:.6em}
table.wt{border-collapse:collapse;font-weight:800;font-size:68px}
table.wt th,table.wt td{border:4px solid var(--navy);text-align:center;padding:8px 26px;min-width:150px}
table.wt th{background:var(--navy);color:#fff;font-family:var(--head)}
.items{display:grid;gap:30px}
.item{border:4px solid #d5dde8;border-radius:24px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:flex-start}
.item .t{font-weight:800;font-size:84px;line-height:1.2}
.item .r{font-weight:800;font-size:68px;color:var(--green);line-height:1.15;min-height:80px}
.pill{display:inline-block;font-family:var(--head);font-weight:600;font-size:46px;background:var(--gold);color:var(--navy);border-radius:40px;padding:8px 32px}
.wt.sm{font-size:58px}.wt.sm th,.wt.sm td{min-width:116px;padding:6px 14px;border-width:3px}.ln.sm{font-size:56px}.pill.sm{font-size:38px;padding:6px 26px}
.tag{font-family:var(--head);font-weight:600;font-size:34px;background:var(--lila);color:#fff;border-radius:30px;padding:2px 22px;vertical-align:middle;margin-left:20px}

/* Titel / Ende */
.center{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:34px}
.center h1{font-family:var(--head);font-weight:700;font-size:112px;line-height:1.15;color:var(--navy)}
.center h2{font-family:var(--head);font-weight:500;font-size:68px;color:var(--orange)}
.center .sub{font-family:var(--head);font-weight:500;font-size:70px;color:var(--lila)}
.center .tip{font-family:var(--text);font-weight:700;font-size:44px;color:#5b6f85;margin-top:-10px}
.center h3{font-family:var(--head);font-weight:700;font-size:92px;color:var(--navy)}
.tiles{display:flex;flex-wrap:wrap;gap:30px;justify-content:center;max-width:1650px}
.tile{font-family:var(--head);font-weight:600;font-size:64px;background:var(--navy);color:#fff;border-radius:30px;padding:30px 54px;line-height:1.2}
.tile:nth-child(even){background:var(--lila)}
.tile:nth-child(3n){background:var(--orange)}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bar" id="bar"></div>
  <header><div id="label" class="chip"></div><div id="prog" class="prog"></div></header>
  <main id="main"></main>
  <footer>
    <button id="back" tabindex="-1">← Zurück</button>
    <div class="hint">Leertaste / → weiter · ← zurück · F Vollbild</div>
    <button id="next" class="main" tabindex="-1">Start</button>
    <button id="fs" tabindex="-1">Vollbild</button>
  </footer>
</div>

<script>
/* ---------- Skalierung ---------- */
function fit(){
  var u=Math.min(window.innerWidth/1920,window.innerHeight/1080);
  document.documentElement.style.setProperty('--u',u);
}
window.addEventListener('resize',fit); fit();

/* ---------- Hilfen ---------- */
var sq=function(t){return '√<span class="rd">'+t+'</span>';};
function S(n,html,cls){return '<div'+(cls?' class="'+cls+'"':'')+' data-s="'+n+'">'+html+'</div>';}
function rows(list,first){
  var h='<div class="rows">';
  list.forEach(function(r,k){
    var s=first+k, a=s>0?' data-s="'+s+'"':'';
    var prev=list[k-1];
    h+='<div class="row"><span class="eq'+(r.fin?' fin':'')+'"'+a+'>'+r.eq+'</span>'+
       (r.op?'<span class="op" data-s="'+(s+1)+'">'+r.op+'</span>':'')+'</div>';
  });
  return h+'</div>';
}

var uid=0;
function plane(o,content){
  var x0=o.x0,x1=o.x1,y0=o.y0,y1=o.y1,u=o.u,ext=.45,L=64,B=64,R=ext*u+48,T=ext*u+28;
  var W=(x1-x0)*u+L+R, H=(y1-y0)*u+T+B;
  var X=function(x){return L+(x-x0)*u;}, Y=function(y){return T+(y1-y)*u;};
  var id='clip'+(++uid), g='', i;
  for(i=x0;i<=x1;i++) g+='<line x1="'+X(i)+'" y1="'+Y(y0)+'" x2="'+X(i)+'" y2="'+Y(y1)+'" stroke="#C5D0DD" stroke-width="1.5"/>';
  for(i=y0;i<=y1;i++) g+='<line x1="'+X(x0)+'" y1="'+Y(i)+'" x2="'+X(x1)+'" y2="'+Y(i)+'" stroke="#C5D0DD" stroke-width="1.5"/>';
  var ax='';
  var xe=X(x1)+ext*u, ye=Y(y1)-ext*u;
  ax+='<line x1="'+X(x0)+'" y1="'+Y(0)+'" x2="'+(xe-4)+'" y2="'+Y(0)+'" stroke="#16324F" stroke-width="4.5"/>';
  ax+='<line x1="'+X(0)+'" y1="'+Y(y0)+'" x2="'+X(0)+'" y2="'+(ye+4)+'" stroke="#16324F" stroke-width="4.5"/>';
  ax+='<polygon points="'+xe+','+Y(0)+' '+(xe-20)+','+(Y(0)-9)+' '+(xe-20)+','+(Y(0)+9)+'" fill="#16324F"/>';
  ax+='<polygon points="'+X(0)+','+ye+' '+(X(0)-9)+','+(ye+20)+' '+(X(0)+9)+','+(ye+20)+'" fill="#16324F"/>';
  var halo='paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round"';
  var tx='font-family="Nunito,Segoe UI,Arial,sans-serif" font-weight="800" font-size="25" fill="#16324F" ';
  var nums='';
  for(i=x0;i<=x1;i++){
    if(i===0) continue;
    nums+='<line x1="'+X(i)+'" y1="'+(Y(0)-8)+'" x2="'+X(i)+'" y2="'+(Y(0)+8)+'" stroke="#16324F" stroke-width="3"/>';
    nums+='<text x="'+X(i)+'" y="'+(Y(0)+36)+'" text-anchor="middle" '+tx+halo+'>'+(i<0?'−'+(-i):i)+'</text>';
  }
  for(i=y0;i<=y1;i++){
    if(i===0) continue;
    nums+='<line x1="'+(X(0)-8)+'" y1="'+Y(i)+'" x2="'+(X(0)+8)+'" y2="'+Y(i)+'" stroke="#16324F" stroke-width="3"/>';
    nums+='<text x="'+(X(0)-16)+'" y="'+(Y(i)+9)+'" text-anchor="end" '+tx+halo+'>'+(i<0?'−'+(-i):i)+'</text>';
  }
  nums+='<text x="'+(X(0)-16)+'" y="'+(Y(0)+36)+'" text-anchor="end" '+tx+halo+'>0</text>';
  var lab='<text x="'+(xe+10)+'" y="'+(Y(0)+10)+'" font-family="Nunito,Segoe UI,Arial,sans-serif" font-style="italic" font-weight="800" font-size="34" fill="#16324F">x</text>'+
          '<text x="'+(X(0)+20)+'" y="'+(ye+14)+'" font-family="Nunito,Segoe UI,Arial,sans-serif" font-style="italic" font-weight="800" font-size="34" fill="#16324F">y</text>';
  var clip='<defs><clipPath id="'+id+'"><rect x="'+X(x0)+'" y="'+Y(y1)+'" width="'+((x1-x0)*u)+'" height="'+((y1-y0)*u)+'"/></clipPath></defs>';
  var bg='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#fff"/>';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'+clip+bg+g+ax+content(X,Y,id)+nums+lab+'</svg>';
}
function ln(X,Y,id,xa,ya,xb,yb,col,w){
  return '<g clip-path="url(#'+id+')"><line x1="'+X(xa)+'" y1="'+Y(ya)+'" x2="'+X(xb)+'" y2="'+Y(yb)+'" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round"/></g>';
}
function cross(X,Y,x,y,col,s){
  var cx=X(x),cy=Y(y),d=11,a=s?' data-s="'+s+'"':'';
  return '<g'+a+' stroke="'+col+'" stroke-width="5" stroke-linecap="round"><line x1="'+(cx-d)+'" y1="'+(cy-d)+'" x2="'+(cx+d)+'" y2="'+(cy+d)+'"/><line x1="'+(cx-d)+'" y1="'+(cy+d)+'" x2="'+(cx+d)+'" y2="'+(cy-d)+'"/></g>';
}
function dot(X,Y,x,y,col,s){
  return '<circle'+(s?' data-s="'+s+'"':'')+' cx="'+X(x)+'" cy="'+Y(y)+'" r="10" fill="'+col+'" stroke="#fff" stroke-width="3"/>';
}
function txt(x,y,t,col,anchor,size,s){
  return '<text'+(s?' data-s="'+s+'"':'')+' x="'+x+'" y="'+y+'" text-anchor="'+(anchor||'start')+'" font-family="Nunito,Segoe UI,Arial,sans-serif" font-weight="800" font-size="'+(size||32)+'" fill="'+col+'" paint-order="stroke" stroke="#fff" stroke-width="7" stroke-linejoin="round">'+t+'</text>';
}

/* ---------- Karten ---------- */
var cards=[];

cards.push({label:null,html:
 '<div class="center"><h1>Noch fit? – Start: Quadratische Funktionen</h1><div class="sub">Wiederholung: Das brauchen wir für Parabeln</div><div class="tip">Allein am iPad? Erst im Heft rechnen, dann auf „Lösung“ tippen.</div></div>'});

/* 1 */
cards.push({label:'Koordinaten ablesen',html:
 '<div class="col"><div class="q">Notiere die Koordinaten.</div>'+
 S(1,'<div class="ln fin m">A(−1 | 2)</div><div class="ln fin m">B(1,5 | −1)</div><div class="ln fin m">C(0 | 1)</div><div class="ln fin m">D(2 | 0)</div>')+
 S(2,'Merke: erst <b>x</b> (rechts/links), dann <b>y</b> (hoch/runter).','merke')+'</div>'+
 '<div class="gfx">'+plane({x0:-2,x1:3,y0:-2,y1:3,u:118},function(X,Y){
   return cross(X,Y,-1,2,'#16324F')+txt(X(-1)+16,Y(2)-14,'A','#16324F')+
          cross(X,Y,1.5,-1,'#16324F')+txt(X(1.5)+16,Y(-1)-14,'B','#16324F')+
          cross(X,Y,0,1,'#16324F')+txt(X(0)+16,Y(1)-14,'C','#16324F')+
          cross(X,Y,2,0,'#16324F')+txt(X(2)+16,Y(0)-14,'D','#16324F');
 })+'</div>'});

/* 2 */
cards.push({label:'Wertetabelle',html:
 '<div class="col"><div class="q">f(x) = 3x + 1 <small>für</small> x = −2; 0; 0,5; 2</div>'+
 '<table class="wt"><tr><th>x</th><td>−2</td><td>0</td><td>0,5</td><td>2</td></tr>'+
 '<tr><th>f(x)</th>'+['−5','1','2,5','7'].map(function(v){return '<td data-s="2" class="fin">'+v+'</td>';}).join('')+'</tr></table>'+
 S(1,'3 · (−2) + 1 = −5','ln m')+'</div>'});

/* 3 */
cards.push({label:'Lineare Funktion lesen',html:
 '<div class="col"><div class="q">y = 2x − 1</div><div class="q s">Steigung?<br>y-Achsenabschnitt?</div>'+
 S(1,'m = 2','ln fin')+S(2,'b = −1','ln fin')+S(3,'Merke: y = m·x + b','merke')+'</div>'+
 '<div class="gfx">'+plane({x0:-2,x1:3,y0:-3,y1:4,u:96},function(X,Y,id){
   return ln(X,Y,id,-2,-5,3,5,'#16324F',5.5)+
     '<polygon points="'+X(0)+','+Y(-1)+' '+X(1)+','+Y(-1)+' '+X(1)+','+Y(1)+'" fill="rgba(217,127,46,.22)"/>'+
     '<line x1="'+X(0)+'" y1="'+Y(-1)+'" x2="'+X(1)+'" y2="'+Y(-1)+'" stroke="#D97F2E" stroke-width="7" stroke-linecap="round"/>'+
     '<line x1="'+X(1)+'" y1="'+Y(-1)+'" x2="'+X(1)+'" y2="'+Y(1)+'" stroke="#6B3F8C" stroke-width="7" stroke-linecap="round"/>'+
     txt(X(.5),Y(-1)+38,'1','#D97F2E','middle',34)+
     txt(X(1)+20,Y(-0.5)+11,'2','#6B3F8C','start',34)+
     '<circle data-s="2" cx="'+X(0)+'" cy="'+Y(-1)+'" r="14" fill="none" stroke="#2E9E5B" stroke-width="5"/>'+
     txt(X(0)+22,Y(-1)+84,'(0 | −1)','#2E9E5B','start',30,2);
 })+'</div>'});

/* 4 */
cards.push({label:'Gleichung aus Graph',html:
 '<div class="col"><div class="q">Wie lautet die Gleichung der Geraden?</div>'+
 S(1,'b = 3','ln fin')+S(2,'m = (−1 − 3) : 2 = −2','ln fin m')+S(3,'y = −2x + 3','ln fin')+'</div>'+
 '<div class="gfx">'+plane({x0:-2,x1:4,y0:-2,y1:4,u:106},function(X,Y,id){
   return ln(X,Y,id,-1,5,3,-3,'#16324F',5.5)+
     dot(X,Y,0,3,'#D97F2E')+txt(X(0)+18,Y(3)-16,'(0 | 3)','#D97F2E','start',30)+
     dot(X,Y,2,-1,'#D97F2E')+txt(X(2)+18,Y(-1)-18,'(2 | −1)','#D97F2E','start',30);
 })+'</div>'});

/* 5 */
cards.push({label:'Punktprobe',html:
 '<div class="col"><div class="q">Liegt P(4 | 5) auf y = 1,5x − 1 ?</div>'+
 S(1,'1,5 · 4 − 1 = 6 − 1 = 5 ✓','ln fin m')+S(2,'→ ja','ln fin')+'</div>'});

/* 6 */
cards.push({label:'Gleichung lösen',html:
 '<div class="col">'+rows([{eq:'4x − 7 = 13',op:'| +7'},{eq:'4x = 20',op:'| : 4'},{eq:'x = 5',fin:1}],0)+'</div>'});

/* 7 */
cards.push({label:'Gleichung mit Klammer',html:
 '<div class="col">'+rows([{eq:'3(x + 2) = 2x + 11'},{eq:'3x + 6 = 2x + 11',op:'| −2x'},{eq:'x + 6 = 11',op:'| −6'},{eq:'x = 5',fin:1}],0)+'</div>'});

/* 8 */
cards.push({label:'Nullstelle',html:
 '<div class="col"><div class="q">Wo schneidet y = 2x − 6 die x-Achse?</div>'+
 rows([{eq:'0 = 2x − 6',op:'| +6'},{eq:'6 = 2x',op:'| : 2'},{eq:'x = 3'},{eq:'N(3 | 0)',fin:1}],1)+'</div>'});

/* 9 */
function item(t,r){return '<div class="item"><div class="t m">'+t+'</div><div class="r" data-s="1">'+r+'</div></div>';}
cards.push({label:'Quadrieren',html:
 '<div class="col"><div class="items" style="grid-template-columns:repeat(4,1fr)">'+
 item('12<sup>2</sup>','144')+item('0,3<sup>2</sup>','0,09')+item('(−4)<sup>2</sup>','16')+item('−4<sup>2</sup>','−16')+'</div>'+
 S(2,'Achtung: (−4)<sup>2</sup> = (−4)·(−4) = 16,<br>aber −4<sup>2</sup> = −(4·4) = −16','achtung')+'</div>'});

/* 10 */
cards.push({label:'Wurzeln',html:
 '<div class="col"><div class="items" style="grid-template-columns:repeat(4,1fr)">'+
 item(sq('144'),'12')+item(sq('0,49'),'0,7')+item(sq('0'),'0')+item(sq('(−9)'),'nicht definiert')+'</div>'+
 S(2,'Keine Zahl mal sich selbst ergibt −9.','achtung')+'</div>'});

/* 11 */
cards.push({label:'Ausblick',tag:'gold',html:
 '<div class="col"><div class="q" style="font-size:96px">x<sup>2</sup> = 25</div>'+
 S(1,'x = 5 oder x = −5','ln fin')+S(2,'denn 5<sup>2</sup> = 25 und (−5)<sup>2</sup> = 25','ln m')+'</div>'});

/* 12 */
cards.push({label:'Binomische Formeln',html:
 '<div class="col"><div class="rows">'+
 '<div class="row"><span class="eq">(x + 3)<sup>2</sup> =</span><span class="eq fin" data-s="1">x<sup>2</sup> + 6x + 9</span></div>'+
 '<div class="row"><span class="eq">(x − 4)<sup>2</sup> =</span><span class="eq fin" data-s="1">x<sup>2</sup> − 8x + 16</span></div></div>'+
 S(2,'Merke:<br>(a + b)<sup>2</sup> = a<sup>2</sup> + 2ab + b<sup>2</sup><br>(a − b)<sup>2</sup> = a<sup>2</sup> − 2ab + b<sup>2</sup>','merke')+'</div>'});

/* 13 */
cards.push({label:'Ausklammern',html:
 '<div class="col"><div class="rows">'+
 '<div class="row"><span class="eq">6x + 9 =</span><span class="eq fin" data-s="1">3(2x + 3)</span></div>'+
 '<div class="row"><span class="eq">x<sup>2</sup> + 5x =</span><span class="eq fin" data-s="1">x(x + 5)</span><span class="tag">E-Kurs</span></div></div></div>'});

/* 14 */
var pv=[[-2,4],[-1,1],[0,0],[1,1],[2,4]];
function parabel(X,Y){
  var p=[],x;
  for(x=-2.2;x<=2.2001;x+=.02) p.push(X(x).toFixed(1)+','+Y(x*x).toFixed(1));
  var h='<polyline data-s="3" points="'+p.join(' ')+'" fill="none" stroke="#16324F" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>';
  pv.forEach(function(q){h+=dot(X,Y,q[0],q[1],'#D97F2E',2);});
  return h;
}
cards.push({label:'Brücke zur Parabel',html:
 '<div class="col"><div class="q s">y = x<sup>2</sup></div>'+
 '<table class="wt sm"><tr><th>x</th>'+pv.map(function(q){return '<td>'+(q[0]<0?'−'+(-q[0]):q[0])+'</td>';}).join('')+'</tr>'+
 '<tr><th>y</th>'+pv.map(function(q){return '<td class="fin" data-s="1">'+q[1]+'</td>';}).join('')+'</tr></table>'+
 S(3,'Was fällt euch auf?','q s')+
 S(4,'symmetrisch zur y-Achse<br>tiefster Punkt (0 | 0)','ln sm fin')+
 S(3,'<span class="pill sm">Normalparabel – darum geht es ab jetzt!</span>')+'</div>'+
 '<div class="gfx">'+plane({x0:-3,x1:3,y0:-1,y1:5,u:96},parabel)+'</div>'});

/* Ende */
cards.push({label:null,end:true,html:
 '<div class="center"><h3>Das brauchen wir für Parabeln</h3><div class="tiles">'+
 ['Koordinaten','Wertetabelle','Quadrieren &amp; Wurzeln','Gleichungen lösen','binomische Formeln'].map(function(t){return '<div class="tile">'+t+'</div>';}).join('')+
 '</div></div>'});

/* ---------- Steuerung ---------- */
var st={c:0,s:0,max:0};
var el={main:document.getElementById('main'),label:document.getElementById('label'),prog:document.getElementById('prog'),
        next:document.getElementById('next'),back:document.getElementById('back'),bar:document.getElementById('bar'),stage:document.getElementById('stage')};
var last=cards.length-1;

function apply(){
  var nodes=el.main.querySelectorAll('[data-s]');
  for(var i=0;i<nodes.length;i++) nodes[i].classList.toggle('on',+nodes[i].getAttribute('data-s')<=st.s);
  var t;
  if(st.c===0) t='Start';
  else if(st.s<st.max) t=st.s===0?'Lösung':'Nächster Schritt';
  else t=st.c===last?'Fertig':(st.c===last-1?'Zur Übersicht':'Weiter');
  el.next.textContent=t;
  el.stage.setAttribute('data-card',st.c);
  el.stage.setAttribute('data-step',st.s);
  el.stage.setAttribute('data-max',st.max);
}
function render(resolved){
  var c=cards[st.c];
  el.main.innerHTML='<div class="card">'+c.html+'</div>';
  var mx=0,nodes=el.main.querySelectorAll('[data-s]');
  for(var i=0;i<nodes.length;i++) mx=Math.max(mx,+nodes[i].getAttribute('data-s'));
  st.max=mx; st.s=resolved?mx:0;
  if(c.label){el.label.style.display='';el.label.textContent=c.label;el.label.className='chip'+(c.tag?' '+c.tag:'');}
  else el.label.style.display='none';
  el.prog.textContent=(st.c>=1&&st.c<=14)?'Karte '+st.c+' / 14':(c.end?'Übersicht':'');
  el.bar.style.width=(st.c/last*100)+'%';
  apply();
}
function next(){
  if(st.s<st.max){st.s++;apply();}
  else if(st.c<last){st.c++;render(false);}
}
function prev(){
  if(st.s>0){st.s--;apply();}
  else if(st.c>0){st.c--;render(true);}
}
function fullscreen(){
  try{
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }catch(e){}
}
document.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key===' '||e.code==='Space'||e.key==='ArrowRight'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'){e.preventDefault();prev();}
  else if(e.key==='f'||e.key==='F'){e.preventDefault();fullscreen();}
});
el.next.addEventListener('click',next);
el.back.addEventListener('click',prev);
document.getElementById('fs').addEventListener('click',fullscreen);
['next','back','fs'].forEach(function(id){document.getElementById(id).addEventListener('mousedown',function(e){e.preventDefault();});});
render(false);
</script>
</body>
</html>
