      return `<span class="seg ${c}"></span>`;}).join('')+'</div>';
  });
  return html+'</div>';
}

function figHTML(q){ return q.bild?`<div class="fig">${q.bild}</div>`:''; }

function renderQuiz(){
  const list=qs(); const q=list[S.idx];
  if(!q){S.view='result';return render();}
  const multi=!!q.mehrfach;
  const done=!!S.checked;
  app.innerHTML=`
  <div class="topbar">
    ${progressHTML(list,q)}
    <div class="meta"><span class="badge">Lernschritt ${q.ls} · ${lsTitle(q.ls)}</span><span class="count">Frage ${S.idx+1} von ${list.length}</span></div>
  </div>
  <div class="card">
    <p class="q" id="qtext">${q.frage}</p>
    ${figHTML(q)}
    ${multi?'<p class="modehint">Mehrere Antworten können richtig sein.</p>':''}
    <div class="opts" role="${multi?'group':'radiogroup'}" aria-labelledby="qtext">
      ${q.optionen.map((o,i)=>{
        let cls='';
        if(done){ if(q.richtig.includes(i)) cls='ok'; else if(S.sel.includes(i)) cls='bad'; }
        else if(S.sel.includes(i)) cls='sel';
        const checked=S.sel.includes(i);
        return `<button type="button" class="opt ${cls}" role="${multi?'checkbox':'radio'}" aria-checked="${checked}" ${done?'aria-disabled="true"':''} data-i="${i}"><span class="mark" aria-hidden="true"></span><span class="otxt">${o}</span></button>`;}).join('')}
    </div>
    <div id="fbbox"></div>
    <div class="actions"><button class="btn" id="go" ${(!done&&!S.sel.length)?'disabled':''}>${done?(S.idx===list.length-1?'Zur Auswertung':'Weiter'):'Prüfen'}</button></div>
  </div>`;
  if(done) showFeedback(q);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i,q));
  document.getElementById('go').onclick=()=>{ if(!S.checked) check(q); else next(list); };
  if(done) document.getElementById('go').focus({preventScroll:true});
}
function pick(i,q){
  if(S.checked) return;
  if(q.mehrfach){ S.sel = S.sel.includes(i)? S.sel.filter(x=>x!==i) : S.sel.concat(i); }
  else S.sel=[i];
  const multi=q.mehrfach;
  app.querySelectorAll('.opt').forEach(b=>{const on=S.sel.includes(+b.dataset.i); b.classList.toggle('sel',on); b.setAttribute('aria-checked',on);});
  document.getElementById('go').disabled = !S.sel.length;
  persist();
}
function check(q){
  if(!S.sel.length) return;
  const ok=isOk(q,S.sel);
  S.ans[q.id]={sel:S.sel.slice(),ok:ok};
  S.checked=true; persist();
  const keepScroll=window.scrollY;
  renderQuiz(); window.scrollTo(0,keepScroll);
  const fb=document.getElementById('fbbox'); if(fb) fb.scrollIntoView({block:'nearest',behavior:'smooth'});
  announce(ok?'Richtig!':'Leider nicht richtig.');
}
function showFeedback(q){
  const a=S.ans[q.id]; if(!a) return;
  const html = a.ok
    ? `<div class="fb ok" role="status"><strong>Richtig!</strong><p>${q.erklaerung||''}</p></div>`
    : `<div class="fb bad" role="status"><strong>Nicht ganz.</strong>${q.tipp_falsch?`<p>${q.tipp_falsch}</p>`:''}<p>${q.erklaerung||''}</p></div>`;
  document.getElementById('fbbox').innerHTML=html;
}
function next(list){
  S.sel=[]; S.checked=false;
  if(S.idx>=list.length-1){ S.view='result'; }
  else S.idx++;
  persist(); render();
}

function stats(){
  const list=qs(); const per={};
  lsList().forEach(l=>per[l.nr]={n:0,ok:0,l:l});
  list.forEach(q=>{ const p=per[q.ls]; if(!p) return; p.n++; if(S.ans[q.id]&&S.ans[q.id].ok) p.ok++; });
  return per;
}
function ampel(ok,n){ const p=n?ok/n:0; return p>=0.8?'green':(p>=0.5?'yellow':'red'); }
function ul(a){ return a&&a.length?'<ul>'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>':''; }

function renderResult(){
  const per=stats(); const list=qs();
  const tot=list.filter(q=>S.ans[q.id]&&S.ans[q.id].ok).length;
  const wrong=list.filter(q=>!(S.ans[q.id]&&S.ans[q.id].ok));
  const sym={green:'✓',yellow:'~',red:'!'};
  const name={green:'grün',yellow:'gelb',red:'rot'};
  app.innerHTML=`
  <div class="total card">
    <div class="big">${tot}/${list.length}</div>
    <div><h1>Deine Auswertung</h1><div class="count">${tot} von ${list.length} Fragen richtig · ${DATA[S.kurs].kurs==='G'?'Grundkurs':'Erweiterungskurs'}</div></div>
  </div>
  <div class="lscards">
  ${Object.values(per).filter(p=>p.n>0).map(p=>{
    const c=ampel(p.ok,p.n);
    const say = c==='green'
      ? `<b>Sitzt!</b> ${p.l.stern&&p.l.stern.length?'Wenn du magst: ★-Aufgaben':''}${ul(p.l.stern)}`
      : `<b>Übe diese Basisaufgaben im Lernpfad:</b>${ul(p.l.basis)}`;
    return `<section class="card ls ${c}">
      <div class="light ${c}" aria-label="Ampel ${name[c]}">${sym[c]}</div>
      <div><h3>Lernschritt ${p.l.nr} · ${p.l.titel}</h3><div class="score">${p.ok} von ${p.n} richtig</div></div>
      <div class="say">${say}</div></section>`;}).join('')}
  </div>
  <div class="actions" style="justify-content:center;flex-wrap:wrap">
    <button class="btn ghost" id="again">Nochmal machen</button>
    ${wrong.length?'<button class="btn" id="rev">Falsche Fragen ansehen</button>':''}
  </div>`;
  document.getElementById('again').onclick=()=>{ store(null); S={view:'start',kurs:null,idx:0,ans:{},checked:false,sel:[]}; render(); };
  const r=document.getElementById('rev'); if(r) r.onclick=()=>{S.view='review';persist();render();};
  persist(); announce('Auswertung: '+tot+' von '+list.length+' richtig.');
}

function renderReview(){
  const list=qs().filter(q=>!(S.ans[q.id]&&S.ans[q.id].ok));
  app.innerHTML=`
  <h1 style="font-size:clamp(24px,5vw,34px);margin:0 0 14px">Falsche Fragen</h1>
  <div class="rev">
  ${list.length?list.map(q=>{
    const a=S.ans[q.id];
    return `<article class="card"><h3>Lernschritt ${q.ls} · ${lsTitle(q.ls)}</h3>
      <p class="q">${q.frage}</p>${figHTML(q)}
      ${a&&a.sel.length?`<div class="rmine">Deine Antwort: ${a.sel.map(i=>q.optionen[i]).join(' · ')}</div>`:'<div class="rmine">Nicht beantwortet.</div>'}
      <div class="rcorrect"><strong>Richtig ist:</strong>${ul(q.richtig.map(i=>q.optionen[i]))}</div>
      <p>${q.erklaerung||''}</p></article>`;}).join(''):'<p class="empty">Alles richtig!</p>'}
  </div>
  <div class="actions" style="justify-content:center"><button class="btn ghost" id="back">Zurück zur Auswertung</button></div>`;
  document.getElementById('back').onclick=()=>{S.view='result';persist();render();};
}

if(typeof DATA==='object'&&DATA) render(); else app.textContent='Daten fehlen.';
})();
</script>
</body>
</html>
