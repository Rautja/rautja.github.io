<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check-up: Pyramide und Kegel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF8F3; --card:#fff; --navy:#16324F; --text:#1B2733; --muted:#5B6773;
  --accent:#D97F2E; --accent-dark:#9E5413; --accent-soft:#FBEBD9;
  --green:#2E7D4F; --yellow:#E8A33D; --red:#C2413B;
  --green-soft:#E3F2E9; --red-soft:#F9E4E2; --yellow-soft:#FCF0DA;
  --line:#E3DCCF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:17.5px;line-height:1.5;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow-x:hidden}
h1,h2,h3,.btn,.badge{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600}
main{max-width:900px;margin:0 auto;padding:20px 16px 48px}
button{font:inherit;color:inherit}
[tabindex="-1"]:focus{outline:none}
:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
.card{background:var(--card);border-radius:18px;border:2px solid var(--navy);box-shadow:0 4px 0 rgba(22,50,79,.12);padding:20px}
[hidden]{display:none!important}

/* Wurzel: Überstrich per border-top, √ davor */
.sqrt{position:relative;display:inline-block;border-top:2px solid currentColor;margin-left:.8em;padding:0 .2em 0 .1em;line-height:1.15;white-space:nowrap}
.sqrt::before{content:"√";position:absolute;left:-.72em;top:.02em;line-height:1.1}
</style>
<style>
/* Start */
.hero{text-align:center;padding:16px 0 8px}
.deco{display:flex;justify-content:center;gap:18px;align-items:flex-end;margin-bottom:6px}
.deco svg{width:64px;height:64px}
h1{font-size:clamp(28px,6vw,42px);line-height:1.15;margin:8px 0 6px;color:var(--navy)}
.sub{font-size:19px;color:var(--muted);margin:0 0 18px}
.hint{max-width:640px;margin:0 auto 24px;text-align:left}
.hint ul{margin:8px 0 0;padding-left:22px}
.hint li{margin:4px 0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.choices{grid-template-columns:1fr}}
.choice{cursor:pointer;text-align:left;border:3px solid var(--navy);border-radius:20px;background:#fff;padding:22px 20px;min-height:150px;
  display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 rgba(22,50,79,.15);transition:transform .08s}
.choice:active{transform:translateY(2px)}
.choice h2{margin:0;font-size:24px;color:#fff;display:inline-block;padding:6px 14px;border-radius:12px;align-self:flex-start}
.choice p{margin:6px 0 0;color:var(--muted)}
.choice.g h2{background:#D97F2E;color:#1B2733}.choice.g{border-color:#D97F2E}
.choice.e h2{background:#6B3F8C}.choice.e{border-color:#6B3F8C}
.resume{margin:0 0 18px;text-align:center}

/* Buttons */
.btn{cursor:pointer;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:20px;padding:14px 26px;min-height:52px;box-shadow:0 4px 0 rgba(0,0,0,.22)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy);box-shadow:none}
.btn.g-text{color:#1B2733}
body[data-kurs=G] .btn:not(.ghost){color:#1B2733}

/* Quiz */
.topbar{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.segs{display:flex;gap:10px;align-items:stretch}
.grp{display:flex;gap:3px;min-width:0}
.seg{flex:1 1 0;height:12px;min-width:4px;border-radius:4px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.seg.done{background:var(--accent);border-color:var(--accent)}
.seg.cur{background:#fff;border:3px solid var(--navy);height:12px}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;font-size:16px}
.badge{background:var(--accent);color:#fff;border-radius:999px;padding:4px 14px;font-size:16px}
body[data-kurs=G] .badge{color:#1B2733}
.count{color:var(--muted);font-weight:700}
.q{font-size:clamp(20px,3.4vw,23px);font-weight:700;line-height:1.4;margin:0 0 14px}
.fig{margin:0 0 16px;text-align:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px}
.fig svg{max-width:100%;height:auto;max-height:45vh;display:inline-block}
.modehint{margin:-6px 0 12px;color:var(--muted);font-size:16px}
.opts{display:flex;flex-direction:column;gap:10px;margin:0 0 16px;padding:0;border:0}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;text-align:left;background:#fff;border:2px solid var(--navy);border-radius:14px;padding:10px 14px;cursor:pointer;font-size:18px}
.opt .mark{flex:none;width:28px;height:28px;border:2.5px solid var(--navy);background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;line-height:1}
.opt[role=radio] .mark{border-radius:50%}
.opt[role=checkbox] .mark{border-radius:7px}
.opt.sel{background:var(--accent-soft);border-color:var(--accent-dark);box-shadow:inset 0 0 0 1px var(--accent-dark)}
.opt.sel .mark{background:var(--accent);border-color:var(--accent-dark);color:#fff}
.opt[role=radio].sel .mark::after{content:"";width:10px;height:10px;border-radius:50%;background:#fff}
.opt[role=checkbox].sel .mark::after{content:"✓"}
.opt.ok{background:var(--green-soft);border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.opt.ok .mark{background:var(--green);border-color:var(--green);color:#fff}
.opt.ok .mark::after{content:"✓"!important;width:auto;height:auto;background:none;border-radius:0}
.opt.bad{background:var(--red-soft);border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.opt.bad .mark{background:var(--red);border-color:var(--red);color:#fff}
.opt.bad .mark::after{content:"✗"!important;width:auto;height:auto;background:none;border-radius:0}
.opt[aria-disabled=true]{cursor:default}
.otxt{flex:1;min-width:0;overflow-wrap:anywhere}
.fb{border-radius:14px;padding:14px 16px;margin:0 0 16px;border:2px solid}
.fb.ok{background:var(--green-soft);border-color:var(--green)}
.fb.bad{background:var(--red-soft);border-color:var(--red)}
.fb strong{font-family:'Fredoka',sans-serif;font-size:20px;display:block;margin-bottom:2px}
.fb.ok strong{color:var(--green)}.fb.bad strong{color:var(--red)}
.fb p{margin:4px 0 0}
.actions{display:flex;justify-content:flex-end;gap:12px}

/* Auswertung */
.total{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 18px}
.total h1{margin:0;font-size:clamp(24px,5vw,34px)}
.big{font-family:'Fredoka',sans-serif;font-weight:700;font-size:44px;color:var(--accent-dark);line-height:1}
.lscards{display:grid;gap:14px;margin-bottom:20px}
.ls{display:grid;grid-template-columns:44px 1fr;gap:6px 16px;align-items:start;border-left-width:10px}
.ls.green{border-left-color:var(--green)}.ls.yellow{border-left-color:var(--yellow)}.ls.red{border-left-color:var(--red)}
.light{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:700;border:2px solid var(--navy)}
.light.green{background:var(--green)}.light.yellow{background:var(--yellow);color:#1B2733}.light.red{background:var(--red)}
.ls h3{margin:0;font-size:21px;color:var(--navy)}
.ls .score{font-weight:700;color:var(--muted)}
.ls .say{grid-column:1/-1;margin:0}
.ls ul{margin:6px 0 0;padding-left:22px}
.ls .say b{font-family:'Fredoka',sans-serif;font-weight:600}
.rev{display:grid;gap:14px;margin-bottom:20px}
.rev h3{margin:0 0 6px;font-size:18px;color:var(--accent-dark)}
.rev .q{font-size:19px}
.rev .rcorrect{background:var(--green-soft);border:2px solid var(--green);border-radius:12px;padding:8px 12px;margin:8px 0}
.rev .rcorrect ul{margin:4px 0 0;padding-left:20px}
.rev .rmine{color:var(--red);margin:4px 0}
.rev .fig svg{max-height:30vh}
.empty{text-align:center;color:var(--green);font-weight:700}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<main id="app" aria-live="off"></main>
<div id="live" class="sr" aria-live="polite" role="status"></div>
<script>
const DATA = {"G":{"kurs":"G","titel":"Check-up Pyramide und Kegel – Grundkurs","lernschritte":[{"nr":1,"titel":"Körper erkennen und Schrägbilder","basis":["S. 137 Nr. 1–6 (blau)","S. 138 Entdecken und verstehen Nr. 1","S. 139 Nr. 1","S. 140 Nr. 1 und 2"],"stern":["S. 139 Nr. 2, 3, 4 (blau)","S. 141 Nr. 3, 4 a–c, 5 (blau)"]},{"nr":2,"titel":"Netz und Oberfläche der Pyramide","basis":["S. 142 Entdecken und verstehen Nr. 1","S. 143 Nr. 1","S. 143 Nr. 2, 3, 4 (blau)","S. 144 Nr. 7, 8, 10"],"stern":["S. 144 Nr. 5, 6, 9 (blau)","S. 145 Nr. 11 (blau)"]},{"nr":3,"titel":"Netz und Oberfläche des Kegels","basis":["S. 146 Entdecken und verstehen Nr. 1","S. 147 Nr. 1","S. 147 Nr. 3, 4, 5 (blau)","S. 148 Nr. 7, 8"],"stern":["S. 147 Nr. 6 (blau)","S. 148 Nr. 9, 10, 11 (blau)"]},{"nr":4,"titel":"Volumen von Pyramide und Kegel","basis":["S. 149 Entdecken und verstehen Nr. 1","S. 150 Nr. 1, 2 a/b, 3, 4, 5 (blau)","S. 151 Nr. 7 a/b","S. 152 Entdecken und verstehen Nr. 1","S. 153 Nr. 1, 4, 5 (blau)"],"stern":["S. 150 Nr. 6 a/b (blau)","S. 151 Nr. 8 (blau)","S. 153 Nr. 6 (blau)","S. 154 Nr. 7, 8 a/b (blau)"]}],"fragen":[{"id":"G1-1","ls":1,"frage":"Eine Eiswaffel (ohne Eis) hat die Form eines Körpers. Wie heißt dieser Körper?","bild":null,"optionen":["Pyramide","Zylinder","Kegel","Kugel"],"richtig":[2],"mehrfach":false,"erklaerung":"Die Eiswaffel hat unten eine Spitze und oben einen runden Rand. Das ist ein Kegel. Bei einer Pyramide wäre die Grundfläche ein Vieleck, zum Beispiel ein Quadrat.","tipp_falsch":"Pyramide und Kegel haben beide eine Spitze. Der Unterschied: Die Grundfläche der Pyramide hat Ecken, die Grundfläche des Kegels ist ein Kreis."},{"id":"G1-2","ls":1,"frage":"Kreuze alle richtigen Aussagen zum Schrägbild an.","bild":null,"optionen":["Kanten, die nach hinten laufen, zeichnest du im 45°-Winkel und nur halb so lang.","Alle Kanten zeichnest du in wahrer Länge.","Verdeckte Kanten zeichnest du durchgezogen.","Die Vorderkante zeichnest du in wahrer Länge."],"richtig":[0,3],"mehrfach":true,"erklaerung":"Im Schrägbild ist die Vorderkante so lang wie in echt. Kanten nach hinten gehen im 45°-Winkel und werden auf die halbe Länge verkürzt. Verdeckte Kanten sind gestrichelt.","tipp_falsch":"Nur die Vorderkante (und alles, was parallel dazu ist) bleibt in wahrer Länge. Nach hinten wird halbiert. Verdeckte Kanten zeichnest du gestrichelt."},{"id":"G1-3","ls":1,"frage":"Du zeichnest das Schrägbild einer Pyramide. Die Grundfläche ist schon fertig. Über welchem Punkt liegt die Spitze der Pyramide? Hier setzt die Körperhöhe h<sub>k<\/sub> an.","bild":"<svg viewBox=\"0 0 400 200\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"70.0,160.0 240.0,160.0 300.1,99.9 130.1,99.9\" fill=\"#CFE4F0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><circle cx=\"155.0\" cy=\"160.0\" r=\"5\" fill=\"#D97F2E\"/><text x=\"155.0\" y=\"186.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#1B2733\">B<\/text><circle cx=\"130.1\" cy=\"99.9\" r=\"5\" fill=\"#D97F2E\"/><text x=\"114.1\" y=\"91.9\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#1B2733\">A<\/text><circle cx=\"185.1\" cy=\"129.9\" r=\"5\" fill=\"#D97F2E\"/><text x=\"189.1\" y=\"117.9\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#1B2733\">C<\/text><circle cx=\"270.1\" cy=\"129.9\" r=\"5\" fill=\"#D97F2E\"/><text x=\"290.1\" y=\"131.9\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#1B2733\">D<\/text><\/svg>","optionen":["Punkt A","Punkt B","Punkt C","Punkt D"],"richtig":[2],"mehrfach":false,"erklaerung":"Die Körperhöhe setzt im Mittelpunkt der Grundfläche an. Du findest ihn, wenn du die beiden Diagonalen zeichnest: Wo sie sich kreuzen, ist der Mittelpunkt. Die Spitze liegt senkrecht darüber.","tipp_falsch":"Die Spitze liegt nicht über einer Ecke oder der Mitte einer Kante. Zeichne die zwei Diagonalen der Grundfläche. Im Kreuzungspunkt geht die Körperhöhe senkrecht nach oben."},{"id":"G1-4","ls":1,"frage":"In diesem Schrägbild einer Pyramide ist ein Fehler. Was ist falsch?","bild":"<svg viewBox=\"0 0 400 240\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"90.0,215.0 220.0,215.0 178.0,67.0\" fill=\"#FBE2C8\" stroke=\"none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"220.0,215.0 266.0,169.0 178.0,67.0\" fill=\"#FBE2C8\" stroke=\"none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"136.0\" y1=\"169.0\" x2=\"266.0\" y2=\"169.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"90.0\" y1=\"215.0\" x2=\"136.0\" y2=\"169.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"178.0\" y1=\"67.0\" x2=\"136.0\" y2=\"169.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"90.0\" y1=\"215.0\" x2=\"220.0\" y2=\"215.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"220.0\" y1=\"215.0\" x2=\"266.0\" y2=\"169.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"178.0\" y1=\"67.0\" x2=\"90.0\" y2=\"215.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"178.0\" y1=\"67.0\" x2=\"220.0\" y2=\"215.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"178.0\" y1=\"67.0\" x2=\"266.0\" y2=\"169.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><\/svg>","optionen":["Die Vorderkante ist zu lang.","Verdeckte Kanten sind nicht gestrichelt.","Die Spitze liegt nicht über dem Mittelpunkt der Grundfläche.","Die Kanten nach hinten haben den falschen Winkel."],"richtig":[1],"mehrfach":false,"erklaerung":"Kanten, die man nicht sehen kann, müssen gestrichelt sein. Hier sind alle Linien durchgezogen. Spitze, Winkel und Vorderkante sind richtig gezeichnet.","tipp_falsch":"Prüfe der Reihe nach: Vorderkante, Winkel (45°), Länge nach hinten (halb) und Spitze. Das alles stimmt hier. Es fehlen nur die gestrichelten Linien für die verdeckten Kanten."},{"id":"G1-5","ls":1,"frage":"So sieht das Schrägbild eines Kegels aus. Wie wird der Grundkreis (orange) im Schrägbild gezeichnet?","bild":"<svg viewBox=\"0 0 400 226\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><path d=\"M110.0 170.0 L200.0 60.0 L290.0 170.0 A90 45.0 0 0 1 110.0 170.0 Z\" fill=\"#FBE2C8\" stroke=\"none\"/><path d=\"M110.0 170 A90 45.0 0 0 1 290.0 170\" fill=\"none\" stroke=\"#D97F2E\" stroke-width=\"3.5\" stroke-dasharray=\"6 5\"/><path d=\"M110.0 170 A90 45.0 0 0 0 290.0 170\" fill=\"none\" stroke=\"#D97F2E\" stroke-width=\"3.5\"/><line x1=\"110.0\" y1=\"170.0\" x2=\"200.0\" y2=\"60.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"290.0\" y1=\"170.0\" x2=\"200.0\" y2=\"60.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><\/svg>","optionen":["Als Kreis in wahrer Größe","Als Quadrat","Als Ellipse, die doppelt so tief wie breit ist","Als Ellipse: genauso breit, aber nur halb so tief"],"richtig":[3],"mehrfach":false,"erklaerung":"Der Kreis wird nach hinten auf die halbe Tiefe verkürzt. Deshalb entsteht eine flache Ellipse: Die Breite (Durchmesser) bleibt, die Tiefe ist nur halb so groß. Die Spitze liegt über dem Mittelpunkt.","tipp_falsch":"Auch beim Kegel gilt: Nach hinten wird alles auf die halbe Länge verkürzt. Ein Kreis wird dadurch zu einer flachen Ellipse."},{"id":"G2-1","ls":2,"frage":"Welches Netz lässt sich zu einer Pyramide mit quadratischer Grundfläche falten?","bild":"<svg viewBox=\"0 0 420 190\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"52.0,70.0 88.0,70.0 70.0,30.0\" fill=\"#FBE2C8\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"52.0,106.0 88.0,106.0 70.0,146.0\" fill=\"#FBE2C8\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"52.0,70.0 52.0,106.0 12.0,88.0\" fill=\"#FBE2C8\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"52.0,70.0 88.0,70.0 88.0,106.0 52.0,106.0\" fill=\"#CFE4F0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"192.0,70.0 228.0,70.0 210.0,30.0\" fill=\"#FBE2C8\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"192.0,106.0 228.0,106.0 210.0,146.0\" fill=\"#FBE2C8\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"192.0,70.0 192.0,106.0 152.0,88.0\" fill=\"#FBE2C8\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"228.0,70.0 228.0,106.0 268.0,88.0\" fill=\"#FBE2C8\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"192.0,70.0 228.0,70.0 228.0,106.0 192.0,106.0\" fill=\"#CFE4F0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"310.0,108.0 346.0,108.0 328.0,68.0\" fill=\"#FBE2C8\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"328.0,68.0 364.0,68.0 346.0,108.0\" fill=\"#FBE2C8\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"346.0,108.0 382.0,108.0 364.0,68.0\" fill=\"#FBE2C8\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"364.0,68.0 400.0,68.0 382.0,108.0\" fill=\"#FBE2C8\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"70.0\" y=\"176.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#1B2733\">Netz A<\/text><text x=\"210.0\" y=\"176.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#1B2733\">Netz B<\/text><text x=\"364.0\" y=\"176.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#1B2733\">Netz C<\/text><\/svg>","optionen":["Netz A","Netz B","Netz C","Keines der Netze"],"richtig":[1],"mehrfach":false,"erklaerung":"Eine Pyramide mit quadratischer Grundfläche hat 1 Quadrat (Grundfläche) und 4 Dreiecke. Nur Netz B hat alle fünf Flächen, und an jeder Seite des Quadrats hängt ein Dreieck.","tipp_falsch":"Zähle die Flächen: Du brauchst 1 Quadrat und 4 Dreiecke, an jeder Quadratseite eins. Bei Netz A fehlt ein Dreieck, bei Netz C fehlt die Grundfläche."},{"id":"G2-2","ls":2,"frage":"Im Netz einer Pyramide sind die vier Dreiecke orange gefärbt. Wie heißt die orange Fläche?","bild":"<svg viewBox=\"0 0 400 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"175.0,105.0 225.0,105.0 200.0,45.0\" fill=\"#D97F2E\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"175.0,155.0 225.0,155.0 200.0,215.0\" fill=\"#D97F2E\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"175.0,105.0 175.0,155.0 115.0,130.0\" fill=\"#D97F2E\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"225.0,105.0 225.0,155.0 285.0,130.0\" fill=\"#D97F2E\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"175.0,105.0 225.0,105.0 225.0,155.0 175.0,155.0\" fill=\"#CFE4F0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><\/svg>","optionen":["Grundfläche G","Mantelfläche M","Oberfläche O","Höhe der Seitenfläche h<sub>a<\/sub>"],"richtig":[1],"mehrfach":false,"erklaerung":"Die Mantelfläche M sind alle Seitenflächen zusammen, bei der Pyramide also die vier Dreiecke. Die Oberfläche O ist das ganze Netz: O = G + M.","tipp_falsch":"Die Oberfläche ist die ganze Fläche des Netzes (Quadrat und Dreiecke). Orange sind nur die Dreiecke. Das ist der Mantel M."},{"id":"G2-3","ls":2,"frage":"Welche Strecke ist die Höhe der Seitenfläche h<sub>a<\/sub>?","bild":"<svg viewBox=\"0 0 400 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"70.0,225.0 210.0,225.0 164.7,75.3\" fill=\"#FBE2C8\" stroke=\"none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"210.0,225.0 259.5,175.5 164.7,75.3\" fill=\"#FBE2C8\" stroke=\"none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"119.5\" y1=\"175.5\" x2=\"259.5\" y2=\"175.5\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-dasharray=\"6 5\" stroke-linecap=\"round\"/><line x1=\"70.0\" y1=\"225.0\" x2=\"119.5\" y2=\"175.5\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-dasharray=\"6 5\" stroke-linecap=\"round\"/><line x1=\"164.7\" y1=\"75.3\" x2=\"119.5\" y2=\"175.5\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-dasharray=\"6 5\" stroke-linecap=\"round\"/><line x1=\"70.0\" y1=\"225.0\" x2=\"210.0\" y2=\"225.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"210.0\" y1=\"225.0\" x2=\"259.5\" y2=\"175.5\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"164.7\" y1=\"75.3\" x2=\"70.0\" y2=\"225.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"164.7\" y1=\"75.3\" x2=\"210.0\" y2=\"225.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"164.7\" y1=\"75.3\" x2=\"259.5\" y2=\"175.5\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"164.7\" y1=\"75.3\" x2=\"140.0\" y2=\"225.0\" stroke=\"#2E7D4F\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"140.0\" cy=\"225.0\" r=\"5\" fill=\"#2E7D4F\"/><line x1=\"164.7\" y1=\"75.3\" x2=\"164.7\" y2=\"200.3\" stroke=\"#D97F2E\" stroke-width=\"4\" stroke-dasharray=\"6 5\" stroke-linecap=\"round\"/><circle cx=\"164.7\" cy=\"200.3\" r=\"5\" fill=\"#D97F2E\"/><text x=\"126.0\" y=\"251.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#2E7D4F\">B<\/text><text x=\"180.7\" y=\"206.3\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#D97F2E\">A<\/text><\/svg>","optionen":["Strecke A (orange)","Die Kante von der Spitze zu einer Ecke","Die Grundkante a","Strecke B (grün)"],"richtig":[3],"mehrfach":false,"erklaerung":"Die Höhe der Seitenfläche h<sub>a<\/sub> liegt in einem Dreieck des Mantels: von der Spitze zur Mitte einer Grundkante (Strecke B). Strecke A geht durch das Innere zum Mittelpunkt der Grundfläche. Das ist die Körperhöhe h<sub>k<\/sub>.","tipp_falsch":"Verwechsle nicht h<sub>a<\/sub> und h<sub>k<\/sub>. h<sub>a<\/sub> liegt auf einer Seitenfläche (Dreieckshöhe), h<sub>k<\/sub> geht senkrecht durch das Innere zur Mitte der Grundfläche."},{"id":"G2-4","ls":2,"frage":"Eine Pyramide hat die Grundkante a = 6 cm und die Höhe der Seitenfläche h<sub>a<\/sub> = 5 cm. Welche Rechnung ergibt die Oberfläche O?","bild":null,"optionen":["O = 6 · 6 + 2 · 6 · 5","O = 6 · 6","O = 2 · 6 · 5","O = 6 · 6 + 6 · 5 : 2"],"richtig":[0],"mehrfach":false,"erklaerung":"O = G + M. Die Grundfläche ist G = 6 · 6 = 36 cm². Der Mantel besteht aus vier Dreiecken: M = 2 · 6 · 5 = 60 cm². Also O = 36 + 60 = 96 cm².","tipp_falsch":"Die Oberfläche besteht aus Grundfläche und Mantel. 6 · 6 ist nur G, 2 · 6 · 5 ist nur M. Und es sind vier Dreiecke, nicht nur eins."},{"id":"G2-5","ls":2,"frage":"In der Formelsammlung heißt die Höhe der Seitenfläche der Pyramide s. Für die Mantelfläche M steht dort keine Formel. Wie berechnest du M bei einer Pyramide mit der Grundkante a?","bild":null,"optionen":["M = a · s : 2","M = π · a · s","M = 2 · a · s","M = a · a + 2 · a · s"],"richtig":[2],"mehrfach":false,"erklaerung":"Der Mantel besteht aus vier Dreiecken mit Grundseite a und Höhe s (im Unterricht h<sub>a<\/sub>). Ein Dreieck hat a · s : 2, also ist M = 4 · a · s : 2 = 2 · a · s. Achtung: In manchen Aufgaben (auch im Lerncheck) ist mit s die Seitenkante gemeint – lies genau, was in der Aufgabe oder Skizze mit s bezeichnet wird.","tipp_falsch":"Du musst die Formel selbst herleiten: vier Dreiecke, jedes a · s : 2. Dann ist M = 2 · a · s. Die Formel a · a + 2 · a · s wäre die Oberfläche, π · a · s gehört zum Kegel."},{"id":"G3-1","ls":3,"frage":"Welches Netz gehört zu einem Kegel?","bild":"<svg viewBox=\"0 0 420 155\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><circle cx=\"70.0\" cy=\"24.0\" r=\"14\" fill=\"#CFE4F0\" stroke=\"#1B2733\" stroke-width=\"2\"/><rect x=\"26.0\" y=\"38\" width=\"88.0\" height=\"40\" fill=\"#FBE2C8\" stroke=\"#1B2733\" stroke-width=\"2\"/><circle cx=\"70.0\" cy=\"92.0\" r=\"14\" fill=\"#CFE4F0\" stroke=\"#1B2733\" stroke-width=\"2\"/><path d=\"M210.0 10.0 L158.0 40.0 A60 60 0 0 0 262.0 40.0 Z\" fill=\"#FBE2C8\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><circle cx=\"210.0\" cy=\"90.0\" r=\"20\" fill=\"#CFE4F0\" stroke=\"#1B2733\" stroke-width=\"2\"/><polygon points=\"320.0,70.0 380.0,70.0 350.0,10.0\" fill=\"#FBE2C8\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><circle cx=\"350.0\" cy=\"88.0\" r=\"18\" fill=\"#CFE4F0\" stroke=\"#1B2733\" stroke-width=\"2\"/><text x=\"70.0\" y=\"140.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#1B2733\">Netz A<\/text><text x=\"210.0\" y=\"140.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#1B2733\">Netz B<\/text><text x=\"350.0\" y=\"140.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#1B2733\">Netz C<\/text><\/svg>","optionen":["Netz A","Netz B","Netz C","Keines der Netze"],"richtig":[1],"mehrfach":false,"erklaerung":"Das Netz eines Kegels besteht aus einem Kreis (Grundfläche) und einem Kreisausschnitt (Mantel). Der Bogen des Kreisausschnitts ist so lang wie der Umfang des Kreises.","tipp_falsch":"Netz A gehört zu einem Zylinder (2 Kreise und ein Rechteck). Beim Kegel ist der Mantel ein Kreisausschnitt, kein Rechteck und kein Dreieck."},{"id":"G3-2","ls":3,"frage":"Das Bild zeigt das Netz eines Kegels. Welche Strecke ist die Mantellinie s?","bild":"<svg viewBox=\"0 0 400 185\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><path d=\"M200.0 15.0 L122.1 60.0 A90 90 0 0 0 277.9 60.0 Z\" fill=\"#FBE2C8\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><circle cx=\"200.0\" cy=\"135.0\" r=\"30\" fill=\"#CFE4F0\" stroke=\"#1B2733\" stroke-width=\"2\"/><line x1=\"200.0\" y1=\"15.0\" x2=\"200.0\" y2=\"105.0\" stroke=\"#D97F2E\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"200.0\" cy=\"15.0\" r=\"5\" fill=\"#D97F2E\"/><line x1=\"200.0\" y1=\"135.0\" x2=\"230.0\" y2=\"135.0\" stroke=\"#2E7D4F\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"200.0\" cy=\"135.0\" r=\"5\" fill=\"#2E7D4F\"/><text x=\"188.0\" y=\"70.0\" text-anchor=\"end\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#D97F2E\">A<\/text><text x=\"245.0\" y=\"141.0\" text-anchor=\"start\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#2E7D4F\">B<\/text><\/svg>","optionen":["Strecke A (orange)","Strecke B (grün)","Der Durchmesser des Kreises","Der Bogen des Kreisausschnitts"],"richtig":[0],"mehrfach":false,"erklaerung":"Der Mantel ist ein Kreisausschnitt. Sein Radius ist die Mantellinie s (Strecke A). Strecke B ist der Radius r des Grundkreises. Der Bogen ist so lang wie der Umfang des Grundkreises.","tipp_falsch":"Die Mantellinie s ist der Radius des Kreisausschnitts, also die Strecke von der Spitze zum Bogen. Der Radius r gehört zum kleinen Grundkreis."},{"id":"G3-3","ls":3,"frage":"Ein Kegel hat den Durchmesser d = 6 cm und die Mantellinie s = 5 cm. Welche Rechnung ergibt die Mantelfläche M?","bild":"<svg viewBox=\"0 0 400 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><path d=\"M110.0 175.0 L190.0 65.0 L270.0 175.0 A80 40.0 0 0 1 110.0 175.0 Z\" fill=\"#FBE2C8\" stroke=\"none\"/><path d=\"M110.0 175 A80 40.0 0 0 1 270.0 175\" fill=\"none\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/><path d=\"M110.0 175 A80 40.0 0 0 0 270.0 175\" fill=\"none\" stroke=\"#1B2733\" stroke-width=\"2\"/><line x1=\"110.0\" y1=\"175.0\" x2=\"190.0\" y2=\"65.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"270.0\" y1=\"175.0\" x2=\"190.0\" y2=\"65.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"110.0\" y1=\"175.0\" x2=\"270.0\" y2=\"175.0\" stroke=\"#D97F2E\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"190.0\" y=\"248.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#D97F2E\">d = 6 cm<\/text><text x=\"250.0\" y=\"118.0\" text-anchor=\"start\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#2E7D4F\">s = 5 cm<\/text><\/svg>","optionen":["M = π · 6 · 5","M = π · 3 · 5","M = π · 3 · 3","M = π · 3 · 5 + π · 3 · 3"],"richtig":[1],"mehrfach":false,"erklaerung":"M = π · r · s. Der Radius ist halb so groß wie der Durchmesser: r = 6 : 2 = 3 cm. Also M = π · 3 · 5 ≈ 47,1 cm².","tipp_falsch":"Achte auf r und d! In der Formel steht der Radius r = d : 2. Und beim Mantel steht π · r · s, nicht π · r · r (das gehört zur Grundfläche)."},{"id":"G3-4","ls":3,"frage":"Du bastelst einen Partyhut aus Pappe. Er hat die Form eines Kegels, aber keinen Boden. Welche Fläche musst du berechnen, um die Pappe zu bestimmen?","bild":null,"optionen":["Nur die Mantelfläche M","Die Grundfläche G","Die Oberfläche O = G + M","Die Grundfläche G zweimal"],"richtig":[0],"mehrfach":false,"erklaerung":"Ohne Boden gibt es keine Grundfläche. Die Pappe ist nur der Mantel. Du rechnest M = π · r · s.","tipp_falsch":"Die Oberfläche enthält auch die Grundfläche (den Boden). Der Partyhut hat aber keinen Boden, deshalb brauchst du nur M."},{"id":"G3-5","ls":3,"frage":"Beim Kegel steht in der Formelsammlung s für die Länge der Mantellinie. Das ist genauso wie im Unterricht. Ein Kegel hat r = 4 cm und s = 5 cm. Welche Rechnung ergibt die Oberfläche O?","bild":null,"optionen":["O = π · 4 · 5","O = π · 5 · 5 + π · 4 · 5","O = π · 4 · 4 + π · 4 · 5","O = π · 4 · 4"],"richtig":[2],"mehrfach":false,"erklaerung":"O = G + M. Die Grundfläche ist G = π · r · r = π · 4 · 4. Der Mantel ist M = π · r · s = π · 4 · 5. Zusammen: O = π · 16 + π · 20 = π · 36 ≈ 113,1 cm².","tipp_falsch":"Die Oberfläche braucht beides: G = π · r · r und M = π · r · s. In G steht der Radius r, nicht die Mantellinie s."},{"id":"G4-1","ls":4,"frage":"Das Volumen einer Pyramide berechnest du mit V = ⅓ · G · h. Im Bild sind zwei Höhen markiert. Welche Länge setzt du für h ein?","bild":"<svg viewBox=\"0 0 400 225\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"110,190 250,190 300,150 160,150\" fill=\"#CFE4F0\" stroke=\"none\"/><polygon points=\"205,30 110,190 250,190\" fill=\"#FBE2C8\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"205,30 250,190 300,150\" fill=\"#FBE2C8\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"110\" y1=\"190\" x2=\"160\" y2=\"150\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"160\" y1=\"150\" x2=\"300\" y2=\"150\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"160\" y1=\"150\" x2=\"205\" y2=\"30\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"205\" y1=\"30\" x2=\"205\" y2=\"170\" stroke=\"#D97F2E\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"205\" y1=\"30\" x2=\"180\" y2=\"190\" stroke=\"#1B2733\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"222\" y=\"112\" text-anchor=\"start\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#D97F2E\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">h<tspan font-size=\"13\" dy=\"4\">k<\/tspan><\/text><text x=\"168\" y=\"112\" text-anchor=\"end\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#1B2733\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">h<tspan font-size=\"13\" dy=\"4\">a<\/tspan><\/text><\/svg>","optionen":["Die Körperhöhe h<sub>k<\/sub> (senkrecht von der Spitze zur Grundfläche)","Die Höhe der Seitenfläche h<sub>a<\/sub>","Die Länge der Seitenkante s","Die Grundkante a"],"richtig":[0],"mehrfach":false,"erklaerung":"Im Volumen steckt die Körperhöhe h<sub>k<\/sub>: der senkrechte Abstand der Spitze zur Grundfläche. Die Höhe der Seitenfläche h<sub>a<\/sub> brauchst du für den Mantel, nicht für das Volumen.","tipp_falsch":"Die Höhe der Seitenfläche liegt schräg auf dem Mantel. Fürs Volumen brauchst du die Höhe, die senkrecht durch den Körper nach unten geht: h<sub>k<\/sub>."},{"id":"G4-2","ls":4,"frage":"Eine quadratische Pyramide hat die Grundkante a = 6 cm und die Körperhöhe h<sub>k<\/sub> = 10 cm. Welcher Term berechnet ihr Volumen?","bild":null,"optionen":["⅓ · 6 · 6 · 10 cm³","6 · 6 · 10 cm³","⅓ · 6 · 10 cm³","⅓ · 6 · 6 · 10 cm²"],"richtig":[0],"mehrfach":false,"erklaerung":"Die Grundfläche ist G = a · a = 6 · 6 = 36 cm². Dann V = ⅓ · 36 · 10 = 120 cm³.","tipp_falsch":"Prüfe drei Dinge: Steht das ⅓ im Term? Ist die Grundfläche a · a (nicht nur a)? Und ist die Einheit cm³, weil es ein Volumen ist?"},{"id":"G4-3","ls":4,"frage":"Ein Kegel hat den Durchmesser d = 12 cm und die Mantellinie s = 10 cm. Für das Volumen brauchst du zuerst die Körperhöhe h<sub>k<\/sub>. Welcher Ansatz mit dem Satz des Pythagoras ist richtig?","bild":null,"optionen":["h<sub>k<\/sub> = <span class=\"sqrt\">10² − 6²<\/span>","h<sub>k<\/sub> = <span class=\"sqrt\">10² + 6²<\/span>","h<sub>k<\/sub> = <span class=\"sqrt\">10² − 12²<\/span>","h<sub>k<\/sub> = 10 − 6"],"richtig":[0],"mehrfach":false,"erklaerung":"Radius r = 12 : 2 = 6 cm, Körperhöhe h<sub>k<\/sub> und Mantellinie s bilden ein rechtwinkliges Dreieck. Die Mantellinie s ist die längste Seite (Hypotenuse): h<sub>k<\/sub>² = s² − r², also h<sub>k<\/sub> = <span class=\"sqrt\">10² − 6²<\/span> = 8 cm.","tipp_falsch":"Die Mantellinie ist die Hypotenuse, also ziehst du r² von s² ab. Und du brauchst den Radius (6 cm), nicht den Durchmesser."},{"id":"G4-4","ls":4,"frage":"Ein Kegel hat den Durchmesser d = 12 cm, die Mantellinie s = 10 cm und die Körperhöhe h<sub>k<\/sub> = 8 cm. Welcher Term berechnet sein Volumen?","bild":null,"optionen":["⅓ · π · 6² · 8 cm³","⅓ · π · 12² · 8 cm³","⅓ · π · 6² · 10 cm³","⅓ · π · 6² · 8 cm²"],"richtig":[0],"mehrfach":false,"erklaerung":"Es gilt V = ⅓ · π · r² · h<sub>k<\/sub> mit r = 12 : 2 = 6 cm und h<sub>k<\/sub> = 8 cm. Also V = ⅓ · π · 36 · 8 ≈ 301,6 cm³.","tipp_falsch":"In die Formel gehören der Radius (halber Durchmesser) und die Körperhöhe, nicht die Mantellinie. Das Ergebnis ist ein Volumen, also cm³."},{"id":"G4-5","ls":4,"frage":"Ein kegelförmiger Becher steht auf der Spitze und wird bis zur halben Höhe gefüllt (siehe Skizze). Wie groß ist der Radius r der Flüssigkeitsoberfläche im Vergleich zum oberen Becherradius R?","bild":"<svg viewBox=\"0 0 400 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"100,50 300,50 200,230\" fill=\"#FBE2C8\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><ellipse cx=\"200\" cy=\"50\" rx=\"100\" ry=\"22\" fill=\"#fff\" stroke=\"#1B2733\" stroke-width=\"2\"/><polygon points=\"150.0,140.0 250.0,140.0 200,230\" fill=\"#D97F2E\" fill-opacity=\"0.45\" stroke=\"#D97F2E\" stroke-width=\"3.5\" stroke-linejoin=\"round\"/><path d=\"M150.0 140.0 A50.0 11.0 0 0 1 250.0 140.0\" fill=\"none\" stroke=\"#D97F2E\" stroke-width=\"3.5\" stroke-dasharray=\"6 5\"/><path d=\"M150.0 140.0 A50.0 11.0 0 0 0 250.0 140.0\" fill=\"#D97F2E\" fill-opacity=\"0.45\" stroke=\"#D97F2E\" stroke-width=\"3.5\"/><line x1=\"200\" y1=\"50\" x2=\"300\" y2=\"50\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><text x=\"312\" y=\"44\" text-anchor=\"start\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#1B2733\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">R<\/text><text x=\"266.0\" y=\"146.0\" text-anchor=\"start\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#D97F2E\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">r = ?<\/text><\/svg>","optionen":["Halb so groß wie R","Ein Viertel von R","Genauso groß wie R","Doppelt so groß wie R"],"richtig":[0],"mehrfach":false,"erklaerung":"Die Flüssigkeit bildet einen kleinen Kegel, der dem Becher ähnlich ist. Ist seine Höhe halb so groß, dann ist auch sein Radius halb so groß: r = R : 2.","tipp_falsch":"Der Becher wird nach unten gleichmäßig schmaler. Auf halber Höhe ist er daher auch nur noch halb so breit wie oben."}]},"E":{"kurs":"E","titel":"Check-up Pyramide und Kegel – Erweiterungskurs","lernschritte":[{"nr":1,"titel":"Körper erkennen und Schrägbilder","basis":["S. 137 Nr. 1–6 (lila)","S. 138 Entdecken und verstehen Nr. 1","S. 139 Nr. 1","S. 140 Nr. 1 und S. 141 Nr. 2"],"stern":["S. 139 Nr. 2, 3 (lila), Nr. 4 (blau)","S. 141 Nr. 3, 4 a–b (lila)","S. 151 Nr. 5 (blau)"]},{"nr":2,"titel":"Netz und Oberfläche der Pyramide","basis":["S. 142 Entdecken und verstehen Nr. 1","S. 143 Nr. 1","S. 143 Nr. 2, 3, 4 (lila)","S. 144 Nr. 7, 8, 10"],"stern":["S. 144 Nr. 5 a–c, 6, 9 (lila)","S. 145 Nr. 11 (blau), 13, 14 (blau)"]},{"nr":3,"titel":"Netz und Oberfläche des Kegels","basis":["S. 146 Entdecken und verstehen Nr. 1","S. 147 Nr. 1","S. 147 Nr. 3, 4, 5 (lila)","S. 148 Nr. 7, 8"],"stern":["S. 147 Nr. 6 (blau)","S. 148 Nr. 9 (blau), 10, 11 (blau)"]},{"nr":4,"titel":"Volumen von Pyramide und Kegel","basis":["S. 149 Entdecken und verstehen Nr. 1","S. 150 Nr. 1, 2 a/b, 3, 4, 5 (lila)","S. 151 Nr. 7","S. 152 Entdecken und verstehen Nr. 1","S. 153 Nr. 1, 4, 5 (lila)"],"stern":[]}],"fragen":[{"id":"E1-1","ls":1,"frage":"Der abgebildete Körper ist eine quadratische Pyramide. Kreuze alle Aussagen an, die stimmen.","bild":"<svg viewBox=\"0 0 400 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"22.0,248.0 286.0,248.0 379.4,154.6 200.7,25.3\" fill=\"#FBE2C8\" fill-opacity=\"1\" stroke=\"none\" stroke-width=\"0\" stroke-linejoin=\"round\"/><line x1=\"22.0\" y1=\"248.0\" x2=\"115.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"115.4\" y1=\"154.6\" x2=\"379.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"200.7\" y1=\"25.3\" x2=\"115.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"22.0\" y1=\"248.0\" x2=\"286.0\" y2=\"248.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"286.0\" y1=\"248.0\" x2=\"379.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"200.7\" y1=\"25.3\" x2=\"22.0\" y2=\"248.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"200.7\" y1=\"25.3\" x2=\"286.0\" y2=\"248.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"200.7\" y1=\"25.3\" x2=\"379.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><\/svg>","optionen":["Er hat 8 Kanten.","Seine Seitenflächen sind Rechtecke.","Er hat 5 Ecken.","Er hat eine gekrümmte Mantelfläche."],"richtig":[0,2],"mehrfach":true,"erklaerung":"Eine quadratische Pyramide hat 5 Ecken (4 an der Grundfläche und die Spitze) und 8 Kanten (4 unten, 4 zur Spitze). Die Seitenflächen sind Dreiecke; gekrümmt ist nur die Mantelfläche des Kegels.","tipp_falsch":"Zähle am Bild nach: 4 Kanten am Boden, 4 Kanten laufen zur Spitze. Alle Seitenflächen treffen sich in der Spitze, also sind es Dreiecke."},{"id":"E1-2","ls":1,"frage":"Du zeichnest ein Schrägbild. Kreuze alle Regeln an, die stimmen.","bild":null,"optionen":["Die Vorderkante zeichnest du in wahrer Länge.","Kanten, die nach hinten laufen, zeichnest du in wahrer Länge.","Verdeckte Kanten zeichnest du gestrichelt.","Kanten, die nach hinten laufen, zeichnest du im 45°-Winkel und auf die halbe Länge verkürzt."],"richtig":[0,2,3],"mehrfach":true,"erklaerung":"Im Schrägbild bleibt die Vorderseite in wahrer Größe. Alles, was nach hinten läuft, wird im 45°-Winkel auf die halbe Länge verkürzt. Verdeckte Kanten werden gestrichelt gezeichnet.","tipp_falsch":"Merke: Nur die Vorderkante hat wahre Länge. Kanten nach hinten werden halbiert (4 cm in Wirklichkeit → 2 cm im Bild). Verdeckte Kanten lässt du nicht weg, du strichelst sie."},{"id":"E1-3","ls":1,"frage":"Die Grundfläche einer quadratischen Pyramide ist schon im Schrägbild gezeichnet. In welchem Punkt setzt die Körperhöhe h<sub>k<\/sub> an?","bild":"<svg viewBox=\"0 0 400 285\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><g transform=\"translate(0,-20)\"><polygon points=\"22.0,248.0 286.0,248.0 379.4,154.6 115.4,154.6\" fill=\"#CFE4F0\" fill-opacity=\"1\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><circle cx=\"332.7\" cy=\"201.3\" r=\"6\" fill=\"#6B3F8C\"/><text x=\"354.7\" y=\"207.3\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"22\" font-weight=\"700\" fill=\"#6B3F8C\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">①<\/text><circle cx=\"154.0\" cy=\"248.0\" r=\"6\" fill=\"#6B3F8C\"/><text x=\"154.0\" y=\"278.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"22\" font-weight=\"700\" fill=\"#6B3F8C\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">②<\/text><circle cx=\"200.7\" cy=\"201.3\" r=\"6\" fill=\"#6B3F8C\"/><text x=\"200.7\" y=\"187.3\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"22\" font-weight=\"700\" fill=\"#6B3F8C\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">③<\/text><circle cx=\"115.4\" cy=\"154.6\" r=\"6\" fill=\"#6B3F8C\"/><text x=\"101.4\" y=\"146.6\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"22\" font-weight=\"700\" fill=\"#6B3F8C\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">④<\/text><\/g><\/svg>","optionen":["Punkt ①","Punkt ②","Punkt ③","Punkt ④"],"richtig":[2],"mehrfach":false,"erklaerung":"Die Spitze liegt senkrecht über dem Mittelpunkt der Grundfläche. Im Schrägbild findest du ihn als Schnittpunkt der beiden Diagonalen (Punkt ③). Dort zeichnest du die Körperhöhe senkrecht nach oben.","tipp_falsch":"Die Mitte einer Kante ist nicht der Mittelpunkt der Grundfläche. Zeichne die beiden Diagonalen: Wo schneiden sie sich?"},{"id":"E1-4","ls":1,"frage":"In diesem Schrägbild einer quadratischen Pyramide steckt ein Fehler. Die Diagonalen der Grundfläche sind grau eingezeichnet. Was ist falsch?","bild":"<svg viewBox=\"0 0 400 285\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"22.0,248.0 286.0,248.0 379.4,154.6 154.0,72.0\" fill=\"#FBE2C8\" fill-opacity=\"1\" stroke=\"none\" stroke-width=\"0\" stroke-linejoin=\"round\"/><line x1=\"22.0\" y1=\"248.0\" x2=\"115.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"115.4\" y1=\"154.6\" x2=\"379.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"154.0\" y1=\"72.0\" x2=\"115.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"22.0\" y1=\"248.0\" x2=\"286.0\" y2=\"248.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"286.0\" y1=\"248.0\" x2=\"379.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"154.0\" y1=\"72.0\" x2=\"22.0\" y2=\"248.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"154.0\" y1=\"72.0\" x2=\"286.0\" y2=\"248.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"154.0\" y1=\"72.0\" x2=\"379.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"22.0\" y1=\"248.0\" x2=\"379.4\" y2=\"154.6\" stroke=\"#8A97A3\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"286.0\" y1=\"248.0\" x2=\"115.4\" y2=\"154.6\" stroke=\"#8A97A3\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><circle cx=\"200.7\" cy=\"201.3\" r=\"4\" fill=\"#8A97A3\"/><\/svg>","optionen":["Die Spitze liegt nicht senkrecht über dem Schnittpunkt der Diagonalen.","Die Grundfläche darf im Schrägbild kein Parallelogramm sein.","Die Vorderkante müsste verkürzt gezeichnet werden.","Die verdeckten Kanten müssten durchgezogen sein."],"richtig":[0],"mehrfach":false,"erklaerung":"Die Spitze muss senkrecht über dem Schnittpunkt der Diagonalen (dem Mittelpunkt der Grundfläche) liegen. Hier sitzt sie über der Mitte der Vorderkante.","tipp_falsch":"Prüfe die Regeln einzeln: Das Parallelogramm, die wahre Vorderkante und die gestrichelten verdeckten Kanten sind richtig. Wo liegt die Spitze im Vergleich zum grauen Punkt?"},{"id":"E1-5","ls":1,"frage":"Ein Kegel hat den Durchmesser d = 6 cm. Du zeichnest sein Schrägbild (siehe Skizze). Wie zeichnest du den Grundkreis?","bild":"<svg viewBox=\"0 0 400 285\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><path d=\"M200,64 L105.4,180.9 A102,51 0 1 0 294.6,180.9 Z\" fill=\"#FBE2C8\" stroke=\"none\"/><path d=\"M105.4,180.9 A102,51 0 0 1 294.6,180.9\" fill=\"none\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/><path d=\"M105.4,180.9 A102,51 0 1 0 294.6,180.9\" fill=\"none\" stroke=\"#1B2733\" stroke-width=\"2\"/><line x1=\"105.4\" y1=\"180.9\" x2=\"200.0\" y2=\"64.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"294.6\" y1=\"180.9\" x2=\"200.0\" y2=\"64.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"98.0\" y1=\"200.0\" x2=\"302.0\" y2=\"200.0\" stroke=\"#6B3F8C\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><text x=\"200.0\" y=\"281.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#6B3F8C\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">d = 6 cm<\/text><\/svg>","optionen":["Als Kreis mit d = 6 cm.","Als Ellipse, 6 cm breit und 6 cm tief.","Als Ellipse, 3 cm breit und 6 cm tief.","Als Ellipse, 6 cm breit und 3 cm tief."],"richtig":[3],"mehrfach":false,"erklaerung":"Der Durchmesser verläuft waagerecht und bleibt in wahrer Länge (6 cm). Die Tiefe wird wie bei allen Kanten nach hinten halbiert: 3 cm. Der hintere Teil der Ellipse ist verdeckt und wird gestrichelt.","tipp_falsch":"Auch beim Kegel gilt: Was waagerecht liegt, bleibt in wahrer Länge, die Tiefe wird halbiert. Deshalb ist der Grundkreis eine flache Ellipse und kein Kreis."},{"id":"E2-1","ls":2,"frage":"Welches der drei Netze lässt sich zu einer quadratischen Pyramide falten?","bild":"<svg viewBox=\"0 0 400 195\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"51.0,62.0 85.0,62.0 85.0,96.0 51.0,96.0\" fill=\"#CFE4F0\" fill-opacity=\"1\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"51.0,62.0 85.0,62.0 68.0,22.0\" fill=\"#FBE2C8\" fill-opacity=\"1\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"51.0,96.0 85.0,96.0 68.0,136.0\" fill=\"#FBE2C8\" fill-opacity=\"1\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"51.0,62.0 51.0,96.0 11.0,79.0\" fill=\"#FBE2C8\" fill-opacity=\"1\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"85.0,62.0 85.0,96.0 125.0,79.0\" fill=\"#FBE2C8\" fill-opacity=\"1\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"68.0\" y=\"175.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"22\" font-weight=\"700\" fill=\"#1B2733\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">A<\/text><polygon points=\"183.0,62.0 217.0,62.0 217.0,96.0 183.0,96.0\" fill=\"#CFE4F0\" fill-opacity=\"1\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"183.0,62.0 217.0,62.0 200.0,22.0\" fill=\"#FBE2C8\" fill-opacity=\"1\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"183.0,62.0 183.0,96.0 143.0,79.0\" fill=\"#FBE2C8\" fill-opacity=\"1\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"217.0,62.0 217.0,96.0 257.0,79.0\" fill=\"#FBE2C8\" fill-opacity=\"1\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"200.0\" y=\"175.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"22\" font-weight=\"700\" fill=\"#1B2733\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">B<\/text><polygon points=\"315.0,62.0 349.0,62.0 349.0,96.0 315.0,96.0\" fill=\"#CFE4F0\" fill-opacity=\"1\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"315.0,62.0 349.0,62.0 349.0,22.0 315.0,22.0\" fill=\"#FBE2C8\" fill-opacity=\"1\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"315.0,96.0 349.0,96.0 349.0,136.0 315.0,136.0\" fill=\"#FBE2C8\" fill-opacity=\"1\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"315.0,62.0 315.0,96.0 275.0,96.0 275.0,62.0\" fill=\"#FBE2C8\" fill-opacity=\"1\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"349.0,62.0 349.0,96.0 389.0,96.0 389.0,62.0\" fill=\"#FBE2C8\" fill-opacity=\"1\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"332.0\" y=\"175.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"22\" font-weight=\"700\" fill=\"#1B2733\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">C<\/text><\/svg>","optionen":["Netz A","Netz B","Netz C"],"richtig":[0],"mehrfach":false,"erklaerung":"Eine quadratische Pyramide besteht aus einem Quadrat (Grundfläche) und vier Dreiecken (Mantelfläche). Netz A hat alle fünf Flächen, Netz B hat nur drei Dreiecke, Netz C hat Rechtecke statt Dreiecke.","tipp_falsch":"Zähle die Flächen: Es müssen 1 Quadrat und 4 Dreiecke sein, die an den Quadratseiten hängen. Die Seitenflächen laufen in der Spitze zusammen, daher sind es Dreiecke."},{"id":"E2-2","ls":2,"frage":"Im Netz einer quadratischen Pyramide sind vier Flächen lila markiert. Welche Größe erhältst du, wenn du den Flächeninhalt der lila Flächen bestimmst?","bild":"<svg viewBox=\"0 0 400 185\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"183.0,70.0 217.0,70.0 217.0,104.0 183.0,104.0\" fill=\"#CFE4F0\" fill-opacity=\"1\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"183.0,70.0 217.0,70.0 200.0,30.0\" fill=\"#6B3F8C\" fill-opacity=\"0.45\" stroke=\"#6B3F8C\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"183.0,104.0 217.0,104.0 200.0,144.0\" fill=\"#6B3F8C\" fill-opacity=\"0.45\" stroke=\"#6B3F8C\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"183.0,70.0 183.0,104.0 143.0,87.0\" fill=\"#6B3F8C\" fill-opacity=\"0.45\" stroke=\"#6B3F8C\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"217.0,70.0 217.0,104.0 257.0,87.0\" fill=\"#6B3F8C\" fill-opacity=\"0.45\" stroke=\"#6B3F8C\" stroke-width=\"2\" stroke-linejoin=\"round\"/><\/svg>","optionen":["Grundfläche G","Mantelfläche M","Oberfläche O","Höhe der Seitenfläche h<sub>a<\/sub>"],"richtig":[1],"mehrfach":false,"erklaerung":"Die vier Dreiecke bilden zusammen die Mantelfläche M. Das Quadrat ist die Grundfläche G. Erst wenn du beides addierst, erhältst du die Oberfläche O = G + M.","tipp_falsch":"G ist nur die Fläche, auf der der Körper steht, M sind die Seitenflächen, O ist alles zusammen. Welche Flächen sind hier markiert?"},{"id":"E2-3","ls":2,"frage":"Welche der drei markierten Strecken ist die Höhe der Seitenfläche h<sub>a<\/sub>?","bild":"<svg viewBox=\"0 0 400 285\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"22.0,248.0 286.0,248.0 379.4,154.6 200.7,25.3\" fill=\"#FBE2C8\" fill-opacity=\"1\" stroke=\"none\" stroke-width=\"0\" stroke-linejoin=\"round\"/><line x1=\"22.0\" y1=\"248.0\" x2=\"115.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"115.4\" y1=\"154.6\" x2=\"379.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"200.7\" y1=\"25.3\" x2=\"115.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"22.0\" y1=\"248.0\" x2=\"286.0\" y2=\"248.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"286.0\" y1=\"248.0\" x2=\"379.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"200.7\" y1=\"25.3\" x2=\"22.0\" y2=\"248.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"200.7\" y1=\"25.3\" x2=\"286.0\" y2=\"248.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"200.7\" y1=\"25.3\" x2=\"379.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"200.7\" y1=\"201.3\" x2=\"200.7\" y2=\"25.3\" stroke=\"#6B3F8C\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"154.0\" y1=\"248.0\" x2=\"200.7\" y2=\"25.3\" stroke=\"#6B3F8C\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"200.7\" y1=\"25.3\" x2=\"286.0\" y2=\"248.0\" stroke=\"#6B3F8C\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"216.7\" y=\"137.3\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"22\" font-weight=\"700\" fill=\"#6B3F8C\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">②<\/text><text x=\"142.0\" y=\"178.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"22\" font-weight=\"700\" fill=\"#6B3F8C\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">③<\/text><text x=\"265.3\" y=\"140.7\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"22\" font-weight=\"700\" fill=\"#6B3F8C\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">①<\/text><\/svg>","optionen":["Strecke ①","Strecke ②","Strecke ③"],"richtig":[2],"mehrfach":false,"erklaerung":"h<sub>a<\/sub> liegt in einer Seitenfläche: Sie läuft von der Spitze senkrecht zur Mitte einer Grundkante (Strecke ③). Strecke ② ist die Körperhöhe h<sub>k<\/sub>, Strecke ① ist eine Seitenkante.","tipp_falsch":"h<sub>k<\/sub> steht senkrecht auf der Grundfläche und liegt im Inneren des Körpers. h<sub>a<\/sub> liegt in einer Dreiecksfläche und trifft die Mitte der Grundkante."},{"id":"E2-4","ls":2,"frage":"Eine quadratische Pyramide hat die Grundkante a = 6 cm, die Körperhöhe h<sub>k<\/sub> = 4 cm und die Höhe der Seitenfläche h<sub>a<\/sub> = 5 cm. Welche Rechnung ergibt die Oberfläche O?","bild":null,"optionen":["2 · 6 · 5","6 · 6 + 2 · 6 · 4","6 · 6 + 6 · 5 : 2","6 · 6 + 2 · 6 · 5"],"richtig":[3],"mehrfach":false,"erklaerung":"O = G + M. Es ist G = a · a = 6 · 6 und M = 2 · a · h<sub>a<\/sub> = 2 · 6 · 5. Also O = 36 + 60 = 96 cm².","tipp_falsch":"Die Mantelfläche rechnest du mit h<sub>a<\/sub> (5 cm), nicht mit h<sub>k<\/sub>. Und bei O darf die Grundfläche nicht fehlen; es müssen alle vier Dreiecke sein, nicht nur eines."},{"id":"E2-5","ls":2,"frage":"Eine quadratische Pyramide hat die Grundkante a = 10 cm und die Körperhöhe h<sub>k<\/sub> = 12 cm. Das lila Dreieck ist rechtwinklig. Mit welchem Ansatz berechnest du h<sub>a<\/sub>?","bild":"<svg viewBox=\"0 0 400 285\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"22.0,248.0 286.0,248.0 379.4,154.6 200.7,25.3\" fill=\"#FBE2C8\" fill-opacity=\"1\" stroke=\"none\" stroke-width=\"0\" stroke-linejoin=\"round\"/><line x1=\"22.0\" y1=\"248.0\" x2=\"115.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"115.4\" y1=\"154.6\" x2=\"379.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"200.7\" y1=\"25.3\" x2=\"115.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"22.0\" y1=\"248.0\" x2=\"286.0\" y2=\"248.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"286.0\" y1=\"248.0\" x2=\"379.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"200.7\" y1=\"25.3\" x2=\"22.0\" y2=\"248.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"200.7\" y1=\"25.3\" x2=\"286.0\" y2=\"248.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"200.7\" y1=\"25.3\" x2=\"379.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"200.7,201.3 154.0,248.0 200.7,25.3\" fill=\"#6B3F8C\" fill-opacity=\"0.18\" stroke=\"none\" stroke-width=\"0\" stroke-linejoin=\"round\"/><line x1=\"200.7\" y1=\"201.3\" x2=\"200.7\" y2=\"25.3\" stroke=\"#6B3F8C\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"200.7\" y1=\"201.3\" x2=\"154.0\" y2=\"248.0\" stroke=\"#6B3F8C\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"154.0\" y1=\"248.0\" x2=\"200.7\" y2=\"25.3\" stroke=\"#6B3F8C\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"222.7\" y=\"187.3\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"20\" font-weight=\"700\" fill=\"#6B3F8C\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">h<tspan baseline-shift=\"sub\" font-size=\"12\">k<\/tspan><\/text><text x=\"128.0\" y=\"190.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"20\" font-weight=\"700\" fill=\"#6B3F8C\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">h<tspan baseline-shift=\"sub\" font-size=\"12\">a<\/tspan><\/text><text x=\"240.7\" y=\"235.3\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#6B3F8C\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">a : 2<\/text><\/svg>","optionen":["h<sub>a<\/sub> = <span class=\"sqrt\">12² + 10²<\/span>","h<sub>a<\/sub> = <span class=\"sqrt\">12² + 5²<\/span>","h<sub>a<\/sub> = <span class=\"sqrt\">12² − 5²<\/span>","h<sub>a<\/sub> = <span class=\"sqrt\">10² + 5²<\/span>"],"richtig":[1],"mehrfach":false,"erklaerung":"Das lila Dreieck hat die Katheten h<sub>k<\/sub> = 12 cm und a : 2 = 5 cm. h<sub>a<\/sub> ist die Hypotenuse. Also h<sub>a<\/sub> = <span class=\"sqrt\">12² + 5²<\/span> = <span class=\"sqrt\">169<\/span> = 13 cm.","tipp_falsch":"Die eine Kathete ist h<sub>k<\/sub>, die andere nur die halbe Grundkante (a : 2 = 5 cm). h<sub>a<\/sub> ist die längste Seite, also die Hypotenuse: Quadrate addieren."},{"id":"E2-6","ls":2,"frage":"In der Formelsammlung heißt die Höhe der Seitenfläche der Pyramide s, und für die Mantelfläche steht nur „M“, aber keine Formel. Eine quadratische Pyramide hat a = 6 cm und s = 5 cm. Kreuze alle Terme an, mit denen du M richtig berechnest.","bild":null,"optionen":["4 · (6 · 5 : 2)","4 · 6 · 5","2 · 6 · 5","π · 6 · 5"],"richtig":[0,2],"mehrfach":true,"erklaerung":"M besteht aus 4 Dreiecken mit Grundseite 6 cm und Höhe s = 5 cm: 4 · (6 · 5 : 2) = 60 cm². Das ist dasselbe wie 2 · a · h<sub>a<\/sub> = 2 · 6 · 5. Das s der Formelsammlung heißt bei uns h<sub>a<\/sub>. Achtung: In manchen Aufgaben (auch im Lerncheck) ist mit s die Seitenkante gemeint – lies genau, was in der Aufgabe oder Skizze mit s bezeichnet wird.","tipp_falsch":"Ein Dreieck hat den Flächeninhalt Grundseite · Höhe : 2, die Pyramide hat vier davon. Vergiss das „: 2“ nicht. π kommt nur beim Kegel vor."},{"id":"E3-1","ls":3,"frage":"Welches Netz gehört zu einem Kegel?","bild":"<svg viewBox=\"0 0 400 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><circle cx=\"66.0\" cy=\"31.0\" r=\"13\" fill=\"#CFE4F0\" stroke=\"#1B2733\" stroke-width=\"2\"/><polygon points=\"22.0,44.0 110.0,44.0 110.0,94.0 22.0,94.0\" fill=\"#FBE2C8\" fill-opacity=\"1\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><circle cx=\"66.0\" cy=\"107.0\" r=\"13\" fill=\"#CFE4F0\" stroke=\"#1B2733\" stroke-width=\"2\"/><text x=\"66.0\" y=\"150.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"22\" font-weight=\"700\" fill=\"#1B2733\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">A<\/text><polygon points=\"200.0,18.0 178.0,84.0 222.0,84.0\" fill=\"#FBE2C8\" fill-opacity=\"1\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><circle cx=\"200.0\" cy=\"104.0\" r=\"20\" fill=\"#CFE4F0\" stroke=\"#1B2733\" stroke-width=\"2\"/><text x=\"200.0\" y=\"150.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"22\" font-weight=\"700\" fill=\"#1B2733\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">B<\/text><path d=\"M334,18 L282.0,48.0 A60,60 0 0 0 386.0,48.0 Z\" fill=\"#FBE2C8\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><circle cx=\"334.0\" cy=\"98.0\" r=\"20\" fill=\"#CFE4F0\" stroke=\"#1B2733\" stroke-width=\"2\"/><text x=\"334.0\" y=\"150.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"22\" font-weight=\"700\" fill=\"#1B2733\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">C<\/text><\/svg>","optionen":["Netz A","Netz B","Netz C"],"richtig":[2],"mehrfach":false,"erklaerung":"Das Netz des Kegels besteht aus einem Kreis (Grundfläche) und einem Kreisausschnitt (Mantelfläche). Der Bogen des Ausschnitts ist so lang wie der Umfang des Kreises.","tipp_falsch":"Der Mantel eines Kegels ist gekrümmt. Abgerollt ergibt er einen Kreisausschnitt, kein Dreieck und kein Rechteck (das gehört zum Zylinder)."},{"id":"E3-2","ls":3,"frage":"Welche der drei markierten Strecken ist die Mantellinie s des Kegels?","bild":"<svg viewBox=\"0 0 400 285\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><path d=\"M200,64 L105.4,180.9 A102,51 0 1 0 294.6,180.9 Z\" fill=\"#FBE2C8\" stroke=\"none\"/><path d=\"M105.4,180.9 A102,51 0 0 1 294.6,180.9\" fill=\"none\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/><path d=\"M105.4,180.9 A102,51 0 1 0 294.6,180.9\" fill=\"none\" stroke=\"#1B2733\" stroke-width=\"2\"/><line x1=\"105.4\" y1=\"180.9\" x2=\"200.0\" y2=\"64.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"294.6\" y1=\"180.9\" x2=\"200.0\" y2=\"64.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"200.0\" y1=\"200.0\" x2=\"302.0\" y2=\"200.0\" stroke=\"#6B3F8C\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"200.0\" y1=\"200.0\" x2=\"200.0\" y2=\"64.0\" stroke=\"#6B3F8C\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"302.0\" y1=\"200.0\" x2=\"200.0\" y2=\"64.0\" stroke=\"#6B3F8C\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"255.0\" y=\"228.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"22\" font-weight=\"700\" fill=\"#6B3F8C\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">①<\/text><text x=\"282.0\" y=\"124.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"22\" font-weight=\"700\" fill=\"#6B3F8C\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">②<\/text><text x=\"216.0\" y=\"138.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"22\" font-weight=\"700\" fill=\"#6B3F8C\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">③<\/text><\/svg>","optionen":["Strecke ①","Strecke ②","Strecke ③"],"richtig":[1],"mehrfach":false,"erklaerung":"Die Mantellinie s läuft auf der Mantelfläche von der Spitze zum Rand des Grundkreises (Strecke ②). Strecke ① ist der Radius r, Strecke ③ die Körperhöhe h<sub>k<\/sub>.","tipp_falsch":"h<sub>k<\/sub> steht senkrecht in der Mitte, r liegt im Grundkreis. Die Mantellinie s liegt außen auf dem Mantel und ist länger als h<sub>k<\/sub>."},{"id":"E3-3","ls":3,"frage":"Ein Partyhut hat die Form eines Kegels ohne Boden. Er ist 12 cm hoch, hat den Durchmesser d = 10 cm und die Mantellinie s = 13 cm. Welcher Term gibt an, wie viel Pappe du für den Hut brauchst?","bild":null,"optionen":["π · 10 · 13","π · 5 · 12","π · 5 · 13","π · 5² + π · 5 · 13"],"richtig":[2],"mehrfach":false,"erklaerung":"Ohne Boden brauchst du nur die Mantelfläche M = π · r · s. Mit r = d : 2 = 5 cm und s = 13 cm ist M = π · 5 · 13 ≈ 204 cm².","tipp_falsch":"Setze den Radius r = d : 2 = 5 cm ein, nicht den Durchmesser, und die Mantellinie s, nicht die Körperhöhe h<sub>k<\/sub>. Der Boden (π · r²) gehört nicht zum Hut."},{"id":"E3-4","ls":3,"frage":"Ein Kegel hat den Radius r = 6 cm und die Körperhöhe h<sub>k<\/sub> = 8 cm. Das lila Dreieck ist rechtwinklig. Wie berechnest du die Mantellinie s?","bild":"<svg viewBox=\"0 0 400 285\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><path d=\"M200,64 L105.4,180.9 A102,51 0 1 0 294.6,180.9 Z\" fill=\"#FBE2C8\" stroke=\"none\"/><path d=\"M105.4,180.9 A102,51 0 0 1 294.6,180.9\" fill=\"none\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/><path d=\"M105.4,180.9 A102,51 0 1 0 294.6,180.9\" fill=\"none\" stroke=\"#1B2733\" stroke-width=\"2\"/><line x1=\"105.4\" y1=\"180.9\" x2=\"200.0\" y2=\"64.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"294.6\" y1=\"180.9\" x2=\"200.0\" y2=\"64.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"200.0,200.0 302.0,200.0 200.0,64.0\" fill=\"#6B3F8C\" fill-opacity=\"0.18\" stroke=\"none\" stroke-width=\"0\" stroke-linejoin=\"round\"/><line x1=\"200.0\" y1=\"200.0\" x2=\"302.0\" y2=\"200.0\" stroke=\"#6B3F8C\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"200.0\" y1=\"200.0\" x2=\"200.0\" y2=\"64.0\" stroke=\"#6B3F8C\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"302.0\" y1=\"200.0\" x2=\"200.0\" y2=\"64.0\" stroke=\"#6B3F8C\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"255.0\" y=\"228.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"20\" font-weight=\"700\" fill=\"#6B3F8C\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">r<\/text><text x=\"288.0\" y=\"126.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"20\" font-weight=\"700\" fill=\"#6B3F8C\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">s<\/text><text x=\"184.0\" y=\"132.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"20\" font-weight=\"700\" fill=\"#6B3F8C\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">h<tspan baseline-shift=\"sub\" font-size=\"12\">k<\/tspan><\/text><\/svg>","optionen":["s = <span class=\"sqrt\">6² + 8²<\/span>","s = <span class=\"sqrt\">8² − 6²<\/span>","s = 6 + 8","s = <span class=\"sqrt\">12² + 8²<\/span>"],"richtig":[0],"mehrfach":false,"erklaerung":"Im lila Dreieck sind r und h<sub>k<\/sub> die Katheten, s ist die Hypotenuse: s = <span class=\"sqrt\">6² + 8²<\/span> = <span class=\"sqrt\">100<\/span> = 10 cm.","tipp_falsch":"s ist die längste Seite des Dreiecks, also die Hypotenuse. Quadriere r und h<sub>k<\/sub> und addiere. Der Radius (6 cm) ist die halbe Breite, nicht der Durchmesser."},{"id":"E4-1","ls":4,"frage":"Eine quadratische Pyramide hat a = 10 cm, h<sub>k<\/sub> = 12 cm und h<sub>a<\/sub> = 13 cm. Welche Länge setzt du für h in V = ⅓ · G · h ein?","bild":"<svg viewBox=\"0 0 400 285\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"22.0,248.0 286.0,248.0 379.4,154.6 200.7,25.3\" fill=\"#FBE2C8\" fill-opacity=\"1\" stroke=\"none\" stroke-width=\"0\" stroke-linejoin=\"round\"/><line x1=\"22.0\" y1=\"248.0\" x2=\"115.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"115.4\" y1=\"154.6\" x2=\"379.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"200.7\" y1=\"25.3\" x2=\"115.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"22.0\" y1=\"248.0\" x2=\"286.0\" y2=\"248.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"286.0\" y1=\"248.0\" x2=\"379.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"200.7\" y1=\"25.3\" x2=\"22.0\" y2=\"248.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"200.7\" y1=\"25.3\" x2=\"286.0\" y2=\"248.0\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"200.7\" y1=\"25.3\" x2=\"379.4\" y2=\"154.6\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"200.7\" y1=\"201.3\" x2=\"200.7\" y2=\"25.3\" stroke=\"#6B3F8C\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><line x1=\"154.0\" y1=\"248.0\" x2=\"200.7\" y2=\"25.3\" stroke=\"#2E7D4F\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"222.7\" y=\"187.3\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"20\" font-weight=\"700\" fill=\"#6B3F8C\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">h<tspan baseline-shift=\"sub\" font-size=\"12\">k<\/tspan><\/text><text x=\"128.0\" y=\"190.0\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-size=\"20\" font-weight=\"700\" fill=\"#2E7D4F\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">h<tspan baseline-shift=\"sub\" font-size=\"12\">a<\/tspan><\/text><\/svg>","optionen":["h<sub>a<\/sub> = 13 cm","h<sub>k<\/sub> = 12 cm","a : 2 = 5 cm","a = 10 cm"],"richtig":[1],"mehrfach":false,"erklaerung":"In die Volumenformel gehört immer die Körperhöhe h<sub>k<\/sub>, also der senkrechte Abstand der Spitze von der Grundfläche. V = ⅓ · 10 · 10 · 12 = 400 cm³.","tipp_falsch":"h<sub>a<\/sub> liegt in der Seitenfläche und gehört zur Mantelfläche. Fürs Volumen brauchst du die Höhe des ganzen Körpers: h<sub>k<\/sub>."},{"id":"E4-2","ls":4,"frage":"Eine quadratische Pyramide hat a = 6 cm, h<sub>k<\/sub> = 4 cm und h<sub>a<\/sub> = 5 cm. Welcher Term gibt das Volumen richtig an?","bild":null,"optionen":["⅓ · 6 · 6 · 4 cm³","⅓ · 6 · 6 · 5 cm³","⅓ · 6 · 4 cm³","⅓ · 6 · 6 · 4 cm²"],"richtig":[0],"mehrfach":false,"erklaerung":"V = ⅓ · G · h<sub>k<\/sub> mit G = 6 · 6 und h<sub>k<\/sub> = 4 cm. Also V = ⅓ · 36 · 4 = 48 cm³. Das Volumen hat die Einheit cm³.","tipp_falsch":"Für G brauchst du die ganze Grundfläche a · a, für h die Körperhöhe h<sub>k<\/sub> (nicht h<sub>a<\/sub>). Volumen messen wir in cm³, Flächen in cm²."},{"id":"E4-3","ls":4,"frage":"Ein Kegel hat den Durchmesser d = 6 cm, die Körperhöhe h<sub>k<\/sub> = 4 cm und die Mantellinie s = 5 cm. Welcher Term gibt das Volumen an?","bild":null,"optionen":["⅓ · π · 6² · 4 cm³","⅓ · π · 3² · 5 cm³","⅓ · π · 3² · 4 cm³","⅓ · π · 3² · 4 cm²"],"richtig":[2],"mehrfach":false,"erklaerung":"V = ⅓ · π · r² · h<sub>k<\/sub> mit r = d : 2 = 3 cm und h<sub>k<\/sub> = 4 cm. Also V = ⅓ · π · 9 · 4 = 12π ≈ 37,7 cm³.","tipp_falsch":"Rechne mit dem Radius r = d : 2 = 3 cm, nicht mit dem Durchmesser. Für h nimmst du die Körperhöhe h<sub>k<\/sub>, nicht die Mantellinie s. Und: Volumen → cm³."},{"id":"E4-4","ls":4,"frage":"Eine Pyramide hat das Volumen V = 96 cm³ und die Grundfläche G = 36 cm². Wie berechnest du die Körperhöhe h<sub>k<\/sub>?","bild":null,"optionen":["h<sub>k<\/sub> = V : (3 · G) = 96 : 108","h<sub>k<\/sub> = G : V · 3 = 36 : 96 · 3","h<sub>k<\/sub> = V · G : 3 = 96 · 36 : 3","h<sub>k<\/sub> = 3 · V : G = 3 · 96 : 36"],"richtig":[3],"mehrfach":false,"erklaerung":"Aus V = ⅓ · G · h<sub>k<\/sub> folgt h<sub>k<\/sub> = 3 · V : G = 3 · 96 : 36 = 8 cm.","tipp_falsch":"Das „⅓“ in der Formel wird zu „·3“ auf der anderen Seite. Dann teilst du durch G: 3 · V : G. Mit der Probe 36 · 8 : 3 = 96 kannst du prüfen."},{"id":"E4-5","ls":4,"frage":"Eine Eiswaffel (Kegel, Spitze unten) hat den Radius r = 3 cm und die Körperhöhe h<sub>k<\/sub> = 12 cm. Sie wird von der Spitze aus bis zu ⅔ ihrer Höhe in Schokolade getaucht. Welchen Radius hat der Kegel am Schokoladenrand?","bild":"<svg viewBox=\"0 0 400 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"155,45 245,45 200,225\" fill=\"#FBE2C8\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linejoin=\"round\"/><ellipse cx=\"200\" cy=\"45\" rx=\"45\" ry=\"14\" fill=\"#fff\" stroke=\"#1B2733\" stroke-width=\"2\"/><polygon points=\"170.0,105.0 230.0,105.0 200,225\" fill=\"#6B3F8C\" fill-opacity=\"0.35\" stroke=\"#6B3F8C\" stroke-width=\"3.5\" stroke-linejoin=\"round\"/><path d=\"M170.0 105.0 A30.0 9.333333333333332 0 0 1 230.0 105.0\" fill=\"none\" stroke=\"#6B3F8C\" stroke-width=\"3.5\" stroke-dasharray=\"6 5\"/><path d=\"M170.0 105.0 A30.0 9.333333333333332 0 0 0 230.0 105.0\" fill=\"#6B3F8C\" fill-opacity=\"0.35\" stroke=\"#6B3F8C\" stroke-width=\"3.5\"/><line x1=\"200\" y1=\"45\" x2=\"245\" y2=\"45\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><text x=\"257\" y=\"41\" text-anchor=\"start\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#1B2733\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">r = 3 cm<\/text><text x=\"246.0\" y=\"111.0\" text-anchor=\"start\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#6B3F8C\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">r = ?<\/text><line x1=\"110\" y1=\"45\" x2=\"110\" y2=\"225\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"104\" y1=\"45\" x2=\"116\" y2=\"45\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"104\" y1=\"225\" x2=\"116\" y2=\"225\" stroke=\"#1B2733\" stroke-width=\"2\" stroke-linecap=\"round\"/><text x=\"100\" y=\"141.0\" text-anchor=\"end\" font-family=\"Nunito, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#1B2733\" stroke=\"#fff\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">h<tspan font-size=\"13\" dy=\"4\">k<\/tspan> = 12 cm<\/text><\/svg>","optionen":["2 cm","1 cm","3 cm","8 cm"],"richtig":[0],"mehrfach":false,"erklaerung":"Der in Schokolade getauchte Teil ist ein kleiner Kegel. In ihm sind alle Längen (Radius, Höhe, Mantellinie) im gleichen Verhältnis verkleinert: Die Höhe ist ⅔ · 12 = 8 cm, also ist der Radius ⅔ · 3 = 2 cm.","tipp_falsch":"Die 8 cm sind die Höhe der Schokolade, nicht der Radius. Der Radius wird mit demselben Faktor ⅔ verkleinert wie die Höhe: ⅔ · 3 cm."}]}};

(function(){
'use strict';
const KEY='checkup-pk-10-v1';
const COL={G:'#D97F2E',E:'#6B3F8C'};
const SOFT={G:'#FBEBD9',E:'#EEE3F5'};
const DARK={G:'#9E5413',E:'#6B3F8C'};
const app=document.getElementById('app'), live=document.getElementById('live');
let S={view:'start',kurs:null,idx:0,ans:{},checked:false,sel:[]};

function store(save){try{ if(save===null) localStorage.removeItem(KEY); else localStorage.setItem(KEY,JSON.stringify(save)); }catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function persist(){ if(!S.kurs||S.view==='start') return; store({kurs:S.kurs,idx:S.idx,ans:S.ans,view:S.view,checked:S.checked,sel:S.sel}); }

function setAccent(k){
  const r=document.documentElement.style;
  if(k){r.setProperty('--accent',COL[k]);r.setProperty('--accent-soft',SOFT[k]);r.setProperty('--accent-dark',DARK[k]);document.body.dataset.kurs=k;}
  else{r.setProperty('--accent','#16324F');r.setProperty('--accent-soft','#E6ECF2');r.setProperty('--accent-dark','#16324F');delete document.body.dataset.kurs;}
}
function qs(){ return DATA[S.kurs].fragen.slice().sort((a,b)=>a.ls-b.ls); }
function lsList(){ return DATA[S.kurs].lernschritte; }
function lsTitle(n){ const l=lsList().find(x=>x.nr===n); return l?l.titel:''; }
function isOk(q,sel){ const a=q.richtig.slice().sort().join(), b=sel.slice().sort().join(); return a===b; }
function announce(t){ live.textContent=''; setTimeout(()=>{live.textContent=t;},30); }
function h(s){return s;}

function pyr(){return '<svg viewBox="0 0 64 64" aria-hidden="true"><polygon points="32,6 8,52 40,58" fill="#F3C48E" stroke="#16324F" stroke-width="3" stroke-linejoin="round"/><polygon points="32,6 40,58 58,46" fill="#D97F2E" stroke="#16324F" stroke-width="3" stroke-linejoin="round"/></svg>';}
function keg(){return '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6 L10 50 A22 8 0 0 0 54 50 Z" fill="#C9A9E0" stroke="#16324F" stroke-width="3" stroke-linejoin="round"/><path d="M10 50 A22 8 0 0 0 54 50" fill="#6B3F8C" stroke="#16324F" stroke-width="3"/></svg>';}

function render(){
  window.scrollTo(0,0);
  if(S.view==='start') renderStart();
  else if(S.view==='quiz') renderQuiz();
  else if(S.view==='result') renderResult();
  else if(S.view==='review') renderReview();
  const hd=app.querySelector('h1,.q'); if(hd){hd.setAttribute('tabindex','-1'); hd.focus({preventScroll:true});}
}

function renderStart(){
  setAccent(null);
  const sv=load();
  const resume = sv && DATA[sv.kurs] && sv.view && (sv.view==='quiz'||sv.view==='result') && Object.keys(sv.ans||{}).length>0;
  app.innerHTML=`
  <section class="hero">
    <div class="deco">${pyr()}${keg()}</div>
    <h1>Check-up: Pyramide und Kegel</h1>
    <p class="sub">Klasse 10 · Bist du bereit für den Lerncheck?</p>
  </section>
  <div class="card hint">
    <strong>Bevor es losgeht:</strong>
    <ul>
      <li>Leg deine Formelsammlung und den Taschenrechner bereit.</li>
      <li>Antworte ehrlich. Es gibt keine Noten.</li>
      <li>Am Ende siehst du, was du im Lernpfad noch üben solltest.</li>
    </ul>
  </div>
  ${resume?`<p class="resume"><button class="btn ghost" id="resume">Dort weitermachen, wo ich aufgehört habe (${sv.kurs==='G'?'Grundkurs':'Erweiterungskurs'})</button></p>`:''}
  <div class="choices">
    <button class="choice g" data-k="G"><h2>Ich bin im Grundkurs</h2><p>Lernschritte 1–4</p></button>
    <button class="choice e" data-k="E"><h2>Ich bin im Erweiterungskurs</h2><p>Lernschritte 1–4</p></button>
  </div>`;
  app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>start(b.dataset.k));
  const r=document.getElementById('resume');
  if(r) r.onclick=()=>{ S={view:sv.view,kurs:sv.kurs,idx:sv.idx||0,ans:sv.ans||{},checked:!!sv.checked,sel:sv.sel||[]}; setAccent(S.kurs); render(); };
}
function start(k){ S={view:'quiz',kurs:k,idx:0,ans:{},checked:false,sel:[]}; setAccent(k); persist(); render(); }

function progressHTML(list,q){
  const groups={}; list.forEach((x,i)=>{(groups[x.ls]=groups[x.ls]||[]).push(i);});
  let html='<div class="segs" role="presentation">';
  Object.keys(groups).forEach(ls=>{
    const ix=groups[ls];
    html+=`<div class="grp" style="flex:${ix.length} 1 0" title="Lernschritt ${ls}">`+ix.map(i=>{
      const c = i===S.idx ? 'cur' : (S.ans[list[i].id]?'done':'');
